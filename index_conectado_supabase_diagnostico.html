<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos - Distribuidora Petits Cadeaux</title>
<style>
body{font-family:Arial,sans-serif;background:#f7f7fb;margin:0;color:#222}
header{background:#7c3aed;color:white;padding:22px 16px}main{max-width:720px;margin:auto;padding:14px}
.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid #e5e7eb}
input,select,textarea{width:100%;padding:11px;margin:5px 0 12px;border:1px solid #ddd;border-radius:10px;font-size:16px;box-sizing:border-box}
.product{display:grid;grid-template-columns:1fr 65px 90px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.product input{margin:0}.price{text-align:right;font-weight:bold}
button{width:100%;padding:13px;border:0;border-radius:10px;background:#7c3aed;color:white;font-weight:bold;font-size:16px}
.total{font-size:25px;font-weight:bold;margin:12px 0}
.ok{background:#ecfdf5;color:#065f46;padding:12px;border-radius:10px;margin-top:12px}
.err{background:#fef2f2;color:#991b1b;padding:12px;border-radius:10px;margin-top:12px}
</style>
</head>
<body>
<header><h2>Distribuidora Petits Cadeaux</h2><div>Pedidos mayoristas para comercios</div></header>
<main>
<div class="card">
<strong>📦 Días de entrega: miércoles y viernes.</strong><br>
<small>Los pedidos se toman hasta el día anterior.</small>
<h3>Datos del comercio</h3>
<label>Nombre del comercio<input id="shop" placeholder="Ej. Almacén Don Pedro"></label>
<label>WhatsApp<input id="phone" placeholder="Ej. 11 1234 5678" inputmode="tel"></label>
<label>Día de entrega<select id="delivery"><option value="">Seleccionar día</option><option>Miércoles</option><option>Viernes</option></select></label>
</div>
<div class="card"><h3>Elegí tus productos</h3><div id="products"></div><div class="total" id="total">$0</div><button id="send">Enviar pedido</button><div id="status"></div></div>
<div class="card"><h3>Observaciones</h3><textarea id="notes" placeholder="Horario de entrega, forma de pago u otra indicación"></textarea></div>
</main>
<script>
const SUPABASE_URL = "https://xwqrswfeimmzdufvfpha.supabase.co";
const SUPABASE_KEY = "sb_publishable_1rnww5jSQ8rGSYNhhRFWww_rfbC4AET";
const PRODUCTS = [
["Clásica x4",2760],["Semillas x4",2890],["Queso x4",3400],["Vegana x4",3200],
["Smash x4",2240],["Smash x8",4180],["Clásicos x6",2250],["Semillas x6",2250],
["Con Queso x6",2950],["Clásicos XL x6",3920],["Semillas XL x6",3920],
["Con Queso XL x6",5250],["Chips Comunes x6",1540],["Chips con Queso x6",2070],
["Pebete x2",1220],["Pan de Molde x1",2550],["Pan Árabe x4",1690]
];
const money=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n);
const $=id=>document.getElementById(id);

function render(){
 $("products").innerHTML=PRODUCTS.map((p,i)=>`<div class="product">
 <span>${p[0]}<br><small>${money(p[1])}</small></span>
 <input data-i="${i}" type="number" min="0" max="999" value="0">
 <span class="price" id="line${i}">$0</span></div>`).join("");
 document.querySelectorAll("[data-i]").forEach(x=>x.addEventListener("input",totalizar));
}
function qty(i){return Math.max(0,Math.min(999,parseInt(document.querySelector(`[data-i="${i}"]`).value)||0))}
function totalizar(){
 let t=0; PRODUCTS.forEach((p,i)=>{let q=qty(i);t+=q*p[1];$("line"+i).textContent=money(q*p[1]);});
 $("total").textContent=money(t);return t;
}
function items(){
 return PRODUCTS.map((p,i)=>({producto:p[0],cantidad:qty(i),precio_unitario:p[1]})).filter(x=>x.cantidad>0);
}
function show(msg,ok){$("status").className=ok?"ok":"err";$("status").textContent=msg}
async function enviar(){
 const comercio=$("shop").value.trim(),dia=$("delivery").value,wa=$("phone").value.trim(),obs=$("notes").value.trim();
 if(!comercio)return show("Ingresá el nombre del comercio.",false);
 if(!dia)return show("Seleccioná miércoles o viernes.",false);
 const total=totalizar(), lista=items();
 if(!total)return show("Seleccioná al menos un producto.",false);
 $("send").disabled=true;$("send").textContent="Guardando...";
 try{
  const r=await fetch(SUPABASE_URL+"/rest/v1/pedidos",{
   method:"POST",
   headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=representation"},
   body:JSON.stringify({comercio,whatsapp:wa,dia_entrega:dia,productos:lista,total,observaciones:obs||null,estado:"Pendiente"})
  });
  const text=await r.text();
  if(!r.ok)throw new Error(text);
  const row=JSON.parse(text)[0], n=row.id;
  show("✅ Pedido registrado correctamente. Pedido #"+String(n).padStart(4,"0"),true);
  let lines=lista.map(x=>`• ${x.cantidad} × ${x.producto} — ${money(x.cantidad*x.precio_unitario)}`).join("\n");
  let msg=`Hola! 👋\nPedido #${String(n).padStart(4,"0")}\nComercio: ${comercio}\nDía de entrega: ${dia}\n\n${lines}\n\nTOTAL: ${money(total)}${obs?"\n\nObservaciones: "+obs:""}\n\nDistribuidora Petits Cadeaux`;
  let p=wa.replace(/\D/g,""); if(p && !p.startsWith("54"))p="54"+p;
  window.open("https://wa.me/"+p+"?text="+encodeURIComponent(msg),"_blank");
 }catch(e){console.error(e);show("❌ No se pudo registrar el pedido. Supabase respondió: " + (e.message || "error desconocido"),false)}
 $("send").disabled=false;$("send").textContent="Enviar pedido";
}
$("send").addEventListener("click",enviar);render();totalizar();
</script>
</body></html>
