<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#35265f">
<link rel="manifest" href="admin-manifest.json">
<link rel="apple-touch-icon" href="icon-admin-192.png">
<link rel="icon" href="icon-admin-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Panel Admin">
<title>Panel Admin - Petits Cadeaux</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--purple:#542477;--lilac:#a66ac7;--ink:#392541;--muted:#76657d;--line:#eaddea}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#fff 0,transparent 30%),linear-gradient(180deg,#f8edf4,#fffafe 42%,#f8f0fa);min-height:100vh}
header{padding:16px;text-align:center;background:linear-gradient(180deg,#fff7fb,#f8eaf4);color:var(--purple);border-bottom:1px solid #ead9e8;box-shadow:0 7px 24px rgba(84,36,119,.08)}
header h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(24px,6vw,34px);font-weight:700}
.header-top{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;position:relative}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.header-actions a,.header-actions button{text-decoration:none}
.header-top{flex-direction:column;gap:10px}.header-top h1{width:100%;text-align:center}
.pill{padding:8px 13px;border-radius:999px;border:1px solid #ead9e8;background:#fff;color:var(--purple);font:700 12px Inter,Arial,sans-serif;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.pill:hover{background:#f5e9f6}
.pill.danger{color:#9b3040;border-color:#f2ccd2}
.integrations{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;align-items:center;margin-top:11px}
.integrations-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.integration-badge{padding:5px 11px;border-radius:999px;background:#f3e8ff;color:#6b21a8;font:700 11px Inter,Arial,sans-serif;white-space:nowrap;border:1px solid #e6d2fb}
main{max-width:820px;margin:auto;padding:18px 14px 42px}
@media(min-width:1000px){main{max-width:1400px;padding:22px 28px 48px}#ordersList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}#ordersList .order{margin-top:0}#ordersList .empty{grid-column:1/-1}.stats{grid-template-columns:repeat(5,1fr)!important}.stat.wide:nth-last-child(2){grid-column:span 2!important}.stat.wide:last-child{grid-column:span 3!important}}
@media(min-width:1700px){#ordersList{grid-template-columns:repeat(3,minmax(0,1fr))}}
.fil-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-top:10px}
.fil-row label{margin:0;font-size:12px;color:var(--muted);font-weight:700}
.fil-row select,.fil-row input{display:block;margin-top:4px;padding:8px 10px;font-size:13px;border-radius:10px;width:auto}
.fil-quick{display:flex;gap:6px;flex-wrap:wrap}
.olist{display:flex;flex-direction:column;gap:8px}
.orow{position:relative;background:#fff;border:1px solid #eee1ef;border-radius:16px}
.orow.anulado{opacity:.6;background:#faf5f5}
.orow.anulado .o-cli b{text-decoration:line-through}
.omain{display:grid;grid-template-columns:26px 1fr auto;grid-template-areas:"chk cli est" "chk meta tot" "chk acc acc";gap:5px 10px;padding:11px 13px;cursor:pointer;align-items:center}
.o-chk{grid-area:chk;align-self:start}.o-chk input{width:18px;height:18px;margin:2px 0 0}
.o-cli{grid-area:cli;font-size:15px;min-width:0}.o-cli b{font-weight:800}
.o-meta{grid-area:meta;display:flex;gap:4px 10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.o-est{grid-area:est;justify-self:end}.o-tot{grid-area:tot;justify-self:end;font-weight:800;color:var(--purple)}
.o-acc{grid-area:acc;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.o-fec{grid-area:fec}.o-num{grid-area:num}.o-ent{grid-area:ent}.o-dir{grid-area:dir}
.o-estsel{margin:0;padding:7px 8px;font-size:12px;font-weight:800;border-width:1.5px;border-radius:999px;width:auto;min-width:0!important;max-width:100%}
@media(min-width:1000px){
 .omain{grid-template-columns:26px 112px 46px 118px minmax(170px,1.3fr) 118px minmax(140px,1.1fr) 92px auto;grid-template-areas:"chk fec num est cli ent dir tot acc";gap:10px;padding:10px 14px}
 .o-meta{display:contents}.o-est{justify-self:start}.o-tot{justify-self:end}
 .o-fec,.o-num,.o-ent,.o-dir{font-size:12.5px;color:var(--ink);white-space:nowrap}.o-num{color:var(--muted)}
 .o-dir{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 #ordersList{display:block!important}
}
.o-ic{padding:8px 11px;font-size:14px;border-radius:11px;background:#fff;border:1px solid #ddcde4;color:#654273}
.kebab-wrap{position:relative}
.kmenu{display:none;position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line);border-radius:13px;box-shadow:0 14px 34px rgba(84,36,119,.2);padding:6px;min-width:190px;z-index:40}
.kmenu.open{display:block}
.kmenu button{display:block;width:100%;text-align:left;background:none;padding:9px 11px;border-radius:9px;font:600 13px Inter,Arial,sans-serif;color:var(--ink)}
.kmenu button:hover{background:#f8edf4}.kmenu button.red{color:#9b3040}
.kmenu hr{border:none;border-top:1px solid #f0e4f1;margin:4px 0}
.odet{border-top:1px dashed #e6d9e8;padding:10px 14px 14px 49px;background:#fdf9fe;border-radius:0 0 16px 16px}
@media(max-width:999px){.odet{padding-left:14px}}
.det-grid{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:12.5px;color:var(--muted)}
.det-grid select{margin:0 0 0 6px;padding:6px 9px;font-size:12.5px;width:auto;display:inline-block}
.item-row{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:3px 0;border-bottom:1px dotted #efe3f0}
.item-row:last-child{border-bottom:0}
.item-row .it-name{flex:1}
.item-row .it-calc{white-space:nowrap;font-size:12.5px;color:var(--muted)}
.item-row .it-calc b{color:var(--ink);font-size:13.5px;margin-left:6px}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:0 10px 30px rgba(84,36,119,.08)}
label{display:block;margin-top:11px;color:#5f4d68;font-size:14px;font-weight:800}
input,select{width:100%;padding:14px 15px;margin-top:7px;border:1px solid #ddcfe1;border-radius:16px;background:#fff;color:var(--ink);font:500 16px Inter,Arial,sans-serif;outline:none}
input:focus,select:focus{border-color:var(--lilac);box-shadow:0 0 0 4px rgba(166,106,199,.13)}
button{border:0;border-radius:15px;font:800 15px Inter,Arial,sans-serif;cursor:pointer}
.btn-main{width:100%;margin-top:16px;padding:15px;background:linear-gradient(135deg,#995ac2,#71369e);color:#fff;box-shadow:0 8px 20px rgba(113,54,158,.22)}
.btn-main:disabled{opacity:.6}
.err{background:#fff0f1;color:#9b3040;border:1px solid #f2ccd2;padding:12px 14px;border-radius:14px;margin-top:12px;font-weight:600;font-size:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logout{padding:9px 15px;background:#fff;border:1px solid #ddcde4;color:#654273}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 4px;margin:14px 0 0}
.chip{padding:9px 15px;border:1px solid #ddcde4;border-radius:13px;background:#fff;color:#654273;font:700 12px Inter,Arial,sans-serif;white-space:nowrap}
.chip.active{background:linear-gradient(135deg,#6d3a97,#9c61c5);color:#fff;border-color:#6d3a97}
.search{margin-top:12px}
.order{border:1px solid #eee1ef;border-radius:18px;padding:15px 16px;margin-top:12px;background:linear-gradient(180deg,#fff,#fdf9fe)}
.order.tomado{opacity:.68}
.order-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.order-shop{font-weight:800;font-size:17px}
.order-meta{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.5}
.badge{padding:5px 11px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.badge.tipo{background:#e8f0fe;color:#1a56b0}
.badge.pendiente{background:#fff1de;color:#a15b00}
.badge.tomado{background:#e6f7ee;color:#177a4d}
.badge.entregado{background:#ede6fb;color:#5a2f8a}
.badge.efectivo{background:#e6f7ee;color:#177a4d}
.badge.transferencia{background:#e8f0fe;color:#1a56b0}
.badge.demorado{background:#fde8e8;color:#a13030}
.badges-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pay-select{margin-top:0;padding:10px 12px;font-size:13px;width:auto;min-width:150px;font-weight:800;border-width:1.5px}
.pay-select.st-pendiente{background:#fff1de;color:#a15b00;border-color:#f0cf94}
.pay-select.st-tomado{background:#e8f0fe;color:#1a56b0;border-color:#b9d0f7}
.pay-select.st-entregado{background:#e6f7ee;color:#177a4d;border-color:#a9e3c4}
.pay-select.pg-pendiente{background:#fff1de;color:#a15b00;border-color:#f0cf94}
.pay-select.pg-efectivo{background:#e6f7ee;color:#177a4d;border-color:#a9e3c4}
.pay-select.pg-transferencia{background:#e8f0fe;color:#1a56b0;border-color:#b9d0f7}
.pay-select.pg-demorado{background:#fde8e8;color:#a13030;border-color:#f3bcbc}
.pay-select.pg-mercado-pago{background:#e0f2ff;color:#0a5a8c;border-color:#a8d8f0}
.items{margin-top:10px;font-size:14px;color:var(--ink);border-top:1px dashed #e6d9e8;padding-top:10px}
.items div{padding:2px 0}
.order-total{margin-top:8px;font-weight:800;color:var(--purple)}
.order-notes{margin-top:8px;font-size:13px;color:var(--muted);font-style:italic}
.descuento-panel{margin-top:10px;background:#fbf7fc;border:1px dashed #dfc8e4;border-radius:14px;padding:12px}
.descuento-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.descuento-row span:first-child{flex:1;color:var(--ink)}
.descuento-input{width:56px;padding:6px 8px;margin:0;font-size:13px;border-radius:9px}
.actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.actions button{padding:11px 14px;font-size:13px}
.btn-take{background:linear-gradient(135deg,#542477,#7d45a9);color:#fff;flex:1}
.btn-wa{background:#e9f8f0;color:#177a4d;border:1px solid #cdecdb!important;border:1px solid;}
.btn-del{background:#fff0f1;color:#9b3040;border:1px solid #f2ccd2!important;border:1px solid;}
.empty{padding:30px;text-align:center;color:#817287;background:#fbf7fc;border:1px dashed #dfd0e4;border-radius:16px;margin-top:14px}
.loading{text-align:center;padding:30px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:15px 16px;box-shadow:0 8px 22px rgba(84,36,119,.07)}
.stat-label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.stat-value{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:700;color:var(--purple);margin-top:2px;line-height:1.1}
.stat.wide{grid-column:1/-1}
.stat-value.small{font-size:19px}
.dias-row{display:flex;gap:18px;margin-top:6px}
.dias-row div{flex:1}
.dias-row span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.dias-row strong{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;color:var(--purple)}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}.stat.wide{grid-column:span 2}}

.admin-menu{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px;position:relative}
.admin-menu-cat{position:relative}
.admin-menu-btn{padding:11px 18px;border-radius:12px;border:1px solid #ead9e8;background:#fff;color:var(--purple);font:600 15px Inter,Arial,sans-serif;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:9px;letter-spacing:.1px}
.admin-menu-btn .mi{width:18px;height:18px;flex:none}
.admin-menu-btn .car{width:6px;height:6px;border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;transform:rotate(45deg) translate(-2px,-2px);margin-left:2px}
.admin-menu{gap:9px!important}
.admin-menu-btn.open,.admin-menu-btn:hover{background:#f5e9f6}
.admin-menu-drop{display:none;position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(84,36,119,.18);padding:7px;min-width:240px;z-index:30;text-align:left}
.admin-menu-drop.open{display:block}
.admin-menu-drop a{display:block;padding:11px 14px;border-radius:9px;color:var(--ink);font-size:14.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.admin-menu-drop a:hover{background:#f8edf4;color:var(--purple)}

.menu-sep{padding:8px 11px 3px;font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;border-top:1px solid var(--line);margin-top:5px}
.header-top{flex-direction:row!important;justify-content:center;position:relative}
.header-top h1{width:auto!important}
.header-actions .pill{padding:6px 11px;font-size:11px}
@media(min-width:1000px){.header-actions{position:absolute;right:0;top:50%;transform:translateY(-50%)}header{padding-top:12px;padding-bottom:12px}}
@media(max-width:999px){.header-top{flex-direction:column!important}.header-top h1{width:100%!important}}
.statbar{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:12px}
.sb{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:14px;padding:7px 16px;display:flex;align-items:baseline;gap:9px;box-shadow:0 6px 16px rgba(84,36,119,.06)}
.sb b{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;color:var(--purple);line-height:1}
.sb span{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.sb-toggle{border:1px solid var(--line);background:#fff;color:#654273;border-radius:14px;padding:0 14px;font:700 12px Inter,Arial,sans-serif;cursor:pointer}
.resumen{display:none;width:100%;gap:8px;flex-wrap:wrap;align-items:center}
.resumen.open{display:flex}
.resumen .rg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:14px;padding:6px 10px}
.resumen .rg em{font-style:normal;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;margin-right:4px}
.resumen .rc{font-size:12px;font-weight:700;color:var(--ink);background:#f8edf4;border-radius:999px;padding:3px 10px}
.resumen .rc strong{color:var(--purple)}
.fil-main{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.fil-main .search{margin:0;flex:1 1 260px;width:auto}
.fil-main select{width:auto;margin:0;padding:11px 12px;font-size:14px;border-radius:14px}
.fil-main .chip{padding:11px 14px}
.fil-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.fil-chips .filters{margin:0;padding:0;flex-wrap:wrap}
.fil-chips .sepv{width:1px;height:22px;background:var(--line);margin:0 4px}
#fechasBox{display:none}
#fechasBox.open{display:flex}
.chip.on{border-color:#6d3a97;color:#6d3a97;background:#f4eaf9}

.ed-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px}
.ed-grid label{margin:8px 0 0;font-size:13px}
.ed-grid input,.ed-grid select{margin-top:5px;padding:11px 12px;font-size:15px;border-radius:12px;width:100%}
.ed-full{grid-column:1/-1}
.ed-row{display:grid;grid-template-columns:1fr 84px 110px 34px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dotted #eee1ef;font-size:14px}
.ed-row input{margin:0;padding:8px 10px;font-size:14px;border-radius:10px;text-align:right}
.ed-row .ed-x{background:none;border:0;color:#c0435a;font-size:18px;cursor:pointer;padding:0}
.ed-row .ed-sub{grid-column:1/-1;text-align:right;font-size:12px;color:var(--muted);margin-top:-4px}
.ed-add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ed-add input{margin:0;padding:10px 12px;font-size:14px;border-radius:12px;flex:1;min-width:120px}
.ed-total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:15px}
.ed-total strong{font-family:"Cormorant Garamond",Georgia,serif;font-size:28px;color:var(--purple)}
@media(max-width:560px){.ed-grid{grid-template-columns:1fr}.ed-row{grid-template-columns:1fr 70px 96px 30px}}
</style>

<body>

<header>
 <div class="header-top">
  <h1>Panel de Pedidos</h1>
  <div class="header-actions" id="headerActions" style="display:none">
   <a class="pill" href="../tienda.html" target="_blank" rel="noopener">Mi tienda</a>
   <a class="pill" href="../regaleria.html" target="_blank" rel="noopener">Regalería</a>
   <button type="button" class="pill danger" id="logoutBtnHeader">Cerrar sesión</button>
  </div>
 </div>
</header>
<script src="menu.js"></script>

<main>

<div id="loginView" class="card" style="max-width:420px;margin:40px auto 0">
  <h2 style="margin:0 0 10px;font-family:'Cormorant Garamond',serif;color:var(--purple);font-size:28px">Iniciar sesión</h2>
  <label>Usuario o email<input id="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
  <label>Contraseña<input id="password" type="password" autocomplete="current-password"></label>
  <button class="btn-main" id="loginBtn">Ingresar</button>
  <div id="loginError"></div>
</div>

<div id="panelView" style="display:none">
  <div class="statbar" id="stats"></div>
  <div class="card">
    <div class="topbar">
      <div><strong id="countLabel">0 pedidos</strong></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
       <button class="logout" id="printSelectedBtn">🖨️ Imprimir pedidos seleccionados</button>
      </div>
    </div>
    <div class="fil-main">
     <input id="searchOrders" class="search" placeholder="🔎 Buscar por comercio...">
     <select id="canalSel"><option value="Todos">Todos los canales</option><option value="mayorista">🏭 Mayorista</option><option value="comercio">🏪 Comercio</option><option value="tienda">🛒 Tienda online</option><option value="regaleria">Regalería</option></select>
     <button type="button" class="chip" id="fechasBtn">📅 Fechas ▾</button>
    </div>
    <div class="fil-chips">
     <div class="filters" id="statusFilters">
      <button type="button" class="chip active" data-f="Todos">Todos</button>
      <button type="button" class="chip" data-f="Pendiente">Pendientes</button>
      <button type="button" class="chip" data-f="Tomado">Tomados</button>
      <button type="button" class="chip" data-f="Entregado">Entregados</button>
      <button type="button" class="chip" data-f="Anulado">Anulados</button>
     </div>
     <span class="sepv"></span>
     <button type="button" class="chip" data-q="hoy">Hoy</button>
     <button type="button" class="chip" data-q="semana">Esta semana</button>
     <button type="button" class="chip" data-q="mes">Este mes</button>
    </div>
    <div class="fil-row" id="fechasBox">
     <label>Filtrar por fecha de
      <select id="fechaTipo"><option value="pedido">Pedido</option><option value="entrega">Entrega</option></select>
     </label>
     <label>Desde<input type="date" id="filtroDesde"></label>
     <label>Hasta<input type="date" id="filtroHasta"></label>
     <button type="button" class="chip" id="limpiarFechas">✕ Limpiar fechas</button>
    </div>
  </div>
  <div id="ordersList"></div>
  <div id="paginacion" style="display:flex;justify-content:center;align-items:center;gap:14px;padding:16px 0"></div>
</div>

</main>

<div id="facModal" style="display:none;position:fixed;inset:0;background:rgba(40,20,55,.55);z-index:110;align-items:center;justify-content:center;padding:14px">

async function guardarDescuentos(id,btn){
 const o=orders.find(x=>x.id===id);
 if(!o)return;
 const card=btn.closest(".orow");
 const inputs=card.querySelectorAll(".descuento-input");
 const nuevosItems=(o.productos||[]).map((it,idx)=>{
  const bonifInput=[...inputs].find(inp=>parseInt(inp.dataset.idx)===idx);
  let bonifPct=bonifInput?parseFloat(bonifInput.value):0;
  if(isNaN(bonifPct))bonifPct=0;
  bonifPct=Math.max(0,Math.min(100,bonifPct));
  const precioLista=it.precio_lista!=null?it.precio_lista:it.precio_unitario;
  const nuevoPrecio=precioLista==null?null:Math.round(precioLista*(1-bonifPct/100)*100)/100;
  return {...it,precio_lista:precioLista,bonif_pct:bonifPct,precio_unitario:nuevoPrecio};
 });
 const nuevoTotal=nuevosItems.some(it=>it.precio_unitario==null)?null:nuevosItems.reduce((s,it)=>s+it.cantidad*it.precio_unitario,0);

 btn.disabled=true;btn.textContent="Guardando...";
 try{
  await apiFetch("/rest/v1/pedidos_distribuidora?id=eq."+id,{
   method:"PATCH",
   headers:{"Prefer":"return=minimal"},
   body:JSON.stringify({productos:nuevosItems,total:nuevoTotal})
  });
  const totalAntes=o.total;
  o.productos=nuevosItems;o.total=nuevoTotal;
  Audit.log(id,"Descuento aplicado","Total de "+money(totalAntes)+" a "+money(nuevoTotal)+" · "+nuevosItems.filter(it=>it.bonif_pct>0).map(it=>it.producto+" -"+it.bonif_pct+"%").join(", "));
  openDescuentoId=null;
  render();
 }catch(e){
  alert("No se pudo guardar el descuento: "+(e.message||"error desconocido"));
  btn.disabled=false;btn.textContent="Guardar descuentos";
 }
}

async function reponerStock(items,motivo){
 for(const it of (items||[])){
  try{
   const r=await apiFetch("/rest/v1/stock_productos?producto=eq."+encodeURIComponent(it.producto)+"&select=cantidad");
   const existe=await r.json();
   const actual=existe.length?existe[0].cantidad:0;
   const nuevo=actual+it.cantidad;
   if(existe.length){
    await apiFetch("/rest/v1/stock_productos?producto=eq."+encodeURIComponent(it.producto),{
     method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify({cantidad:nuevo})
    });
   }else{
    await apiFetch("/rest/v1/stock_productos",{
     method:"POST",headers:{"Prefer":"return=minimal"},body:JSON.stringify({producto:it.producto,cantidad:nuevo})
    });
   }
   await apiFetch("/rest/v1/movimientos_stock",{
    method:"POST",headers:{"Prefer":"return=minimal"},
    body:JSON.stringify({producto:it.producto,tipo:"entrada",cantidad:it.cantidad,motivo})
   });
  }catch(e){/* no bloquea el borrado del pedido si falla el stock */}
 }
}

   const est=o.estado_entrega==="Entregado"?"Entregado":(o.estado==="Tomado"?"Tomado":"Pendiente");

const fmtNro=(pv,n)=>String(pv||0).padStart(4,"0")+"-"+String(n||0).padStart(8,"0");
function compBadgeHtml(o){
 const b=[];
 if(o.factura_cae)b.push(`<span class="badge" style="background:#e6f7ee;color:#177a4d">🧾 Factura C ${fmtNro(o.factura_pto_vta,o.factura_nro)}</span>`);
 if(o.remito_nro)b.push(`<span class="badge" style="background:#fff1de;color:#a15b00">📄 Remito ${fmtNro(o.remito_pto_vta||1,o.remito_nro)}</span>`);
 if(!b.length)b.push(`<span class="badge" style="background:#fde8e8;color:#a13030">Sin facturar</span>`);
 return b.join(" ");
}
function facBtn(o){
 if(window.Perm&&!Perm.can("facturar"))return "";
 if(o.factura_cae)return `<button class="btn-wa" onclick="window.open('facturacion.html?ver=${o.id}','_self')">💼 Ver en Facturación</button>`;
 return `<button class="btn-del" style="font-weight:800" onclick="abrirFacturar(${o.id})">🧾 ${o.remito_nro?"Facturar (ARCA)":"Facturar"}</button>`;
}
function cerrarFac(){$("facModal").style.display="none"}
function abrirFacturar(id){
 const o=orders.find(x=>x.id===id);if(!o)return;
 if(o.remito_nro){window.open("comprobante.html?ids="+id,"_blank");return}
 $("facModalBody").innerHTML=`<div style="font-family:'Cormorant Garamond',serif;color:var(--purple);font-size:26px;font-weight:700">Facturar orden</div>
  <div style="color:var(--muted);font-size:13px;margin:4px 0 14px">${esc(o.comercio||"")} · ${money(o.total)}</div>
  <button class="btn-take" style="width:100%;padding:16px;margin-bottom:10px;text-align:left" onclick="cerrarFac();window.open('comprobante.html?ids=${id}','_blank')">🧾 Comprobante<br><span style="font-weight:500;font-size:12px">Factura C electrónica (ARCA)</span></button>
  <button class="btn-wa" style="width:100%;padding:16px;text-align:left" onclick="confirmarRemito(${id})">📄 Otro<br><span style="font-weight:500;font-size:12px">Remito manual (compromiso de pago, no fiscal)</span></button>

function confirmarRemito(id){
 const o=orders.find(x=>x.id===id);if(!o)return;
 const filas=(o.productos||[]).map(it=>`<tr><td style="padding:5px 4px;border-bottom:1px solid #f0e4f1">${it.cantidad} × ${esc(it.producto)}${it.cambio?" (CAMBIO)":""}</td><td style="padding:5px 4px;border-bottom:1px solid #f0e4f1;text-align:right;white-space:nowrap">${it.cambio?"$0":(it.precio_unitario!=null?money(it.precio_unitario)+" c/u":"")}</td><td style="padding:5px 4px;border-bottom:1px solid #f0e4f1;text-align:right;font-weight:800;white-space:nowrap">${it.cambio?"":(it.precio_unitario!=null?money(it.cantidad*it.precio_unitario):"a confirmar")}</td></tr>`).join("");
 $("facModalBody").innerHTML=`<div style="font-family:'Cormorant Garamond',serif;color:var(--purple);font-size:26px;font-weight:700">Confirmar remito</div>
  <div style="font-size:14px;line-height:1.6;margin-top:6px"><b>${esc(o.comercio||"")}</b><br>${esc(o.domicilio||"")}<br><span style="color:var(--muted)">Fecha: ${new Date().toLocaleDateString("es-AR")} · Pedido #${o.id}</span></div>
  <table style="width:100%;border-collapse:collapse;margin-top:10px;font-size:13.5px">${filas}</table>
  <div style="display:flex;justify-content:space-between;font-weight:800;color:var(--purple);margin-top:10px;font-size:16px"><span>Total</span><span>${money(o.total)}</span></div>
  ${o.observaciones?`<div class="order-notes">📝 ${esc(o.observaciones)}</div>`:""}
  <div style="font-size:12px;color:var(--muted);margin-top:10px">Se le asigna el próximo número de remito. No es una factura: no suma al Monotributo hasta que emitas la Factura C.</div>
  <div class="actions" style="justify-content:flex-end"><button class="chip" onclick="abrirFacturar(${id})">← Volver</button><button class="btn-take" style="flex:none" id="remitoOkBtn" onclick="generarRemito(${id},this)">✅ Confirmar y guardar</button></div>`;
}
async function generarRemito(id,btn){
 btn.disabled=true;btn.textContent="Guardando...";
 try{
  const resp=await apiFetch("/rest/v1/rpc/asignar_remito",{method:"POST",body:JSON.stringify({p_pedido:id})});
  const rows=await resp.json();
  if(!resp.ok)throw new Error(rows.message||"Error de Supabase");
  const r=Array.isArray(rows)?rows[0]:rows;
  if(!r||!r.remito_nro)throw new Error("No se pudo asignar el número de remito");
  Audit.log(id,"Remito generado","Remito "+fmtNro(r.remito_pto_vta,r.remito_nro));
  location.href="facturacion.html?ver="+id;
 }catch(e){
  alert("No se pudo generar el remito: "+(e.message||"error")+"\n¿Ya corriste sql-facturacion.sql en Supabase?");
  btn.disabled=false;btn.textContent="✅ Confirmar y guardar";
 }
}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

let editId=null,editItems=[],editBloqueado=false;
function fechaLocalISO(iso){
 if(!iso)return "";
 const d=new Date(iso);
 return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function abrirEditar(id){
 const o=orders.find(x=>x.id===id);
 if(!o)return;
 editId=id;
 editBloqueado=!!(o.factura_cae||o.remito_nro);
 editItems=(o.productos||[]).map(it=>({...it}));
 $("editarTitulo").textContent="Editar pedido #"+id;
 $("edComercio").value=o.comercio||"";
 $("edWhatsapp").value=o.whatsapp||"";
 $("edDomicilio").value=o.domicilio||"";
 $("edObs").value=o.observaciones||"";
 $("edFecha").value=fechaLocalISO(o.created_at);

 if(![...sel.options].some(op=>op.value===dia)){const op=document.createElement("option");op.textContent=dia;sel.appendChild(op)}
 sel.value=dia;
 $("editarAviso").innerHTML=editBloqueado?'<div class="err" style="background:#fff7e6;color:#8a5a00;border-color:#f3dfb0">Este pedido ya tiene un comprobante emitido ('+(o.factura_cae?"factura":"remito")+'). Podés corregir los datos de contacto y entrega, pero no los productos ni el importe.</div>':"";
 $("edAgregar").style.display=editBloqueado?"none":"flex";
 $("editarMsg").innerHTML="";
 $("editarGuardar").disabled=false;$("editarGuardar").textContent="Guardar cambios";
 renderEditItems();
 $("editarModal").style.display="flex";
}
function totalEdit(){
 if(!editItems.length)return 0;
 return editItems.some(it=>it.precio_unitario==null)?null:editItems.reduce((s,it)=>s+(Number(it.cantidad)||0)*it.precio_unitario,0);
}
function renderEditItems(){
 $("edItems").innerHTML=editItems.map((it,i)=>`<div class="ed-row">
  <div>${esc(it.producto)}${it.bonif_pct>0?` <span class="badge tipo" style="font-size:9px">-${it.bonif_pct}%</span>`:""}</div>
  <input type="number" min="1" step="1" value="${it.cantidad}" ${editBloqueado?"disabled":""} onchange="editCant(${i},this.value)" title="Cantidad">
  <input type="number" min="0" step="0.01" value="${it.precio_unitario==null?"":it.precio_unitario}" placeholder="A confirmar" ${editBloqueado?"disabled":""} onchange="editPrecio(${i},this.value)" title="Precio unitario">
  ${editBloqueado?"<span></span>":`<button type="button" class="ed-x" onclick="editQuitar(${i})" title="Quitar">✕</button>`}
 </div>`).join("")||'<div style="font-size:13px;color:var(--muted);padding:8px 0">Sin productos</div>';
 const oo=orders.find(x=>x.id===editId);
 const t=editBloqueado&&oo?oo.total:totalEdit();
 $("edTotal").textContent=t==null?"A confirmar":money(t);
}
function editCant(i,v){const n=parseInt(v);editItems[i].cantidad=(isNaN(n)||n<1)?1:n;renderEditItems()}
function editPrecio(i,v){
 const p=v===""?null:parseFloat(v);
 editItems[i].precio_unitario=(p==null||isNaN(p))?null:Math.max(0,p);
 // si cambian el precio a mano, ese pasa a ser el precio de lista y se quita el descuento
 editItems[i].precio_lista=editItems[i].precio_unitario;editItems[i].bonif_pct=0;
 renderEditItems();
}
function editQuitar(i){editItems.splice(i,1);renderEditItems()}
function editAgregar(){
 const nombre=$("edNuevoProd").value.trim();
 const cant=parseInt($("edNuevoCant").value)||1;
 const precio=$("edNuevoPrecio").value===""?null:parseFloat($("edNuevoPrecio").value);
 if(!nombre){$("editarMsg").innerHTML='<div class="err">Escribí el nombre del producto.</div>';return}
 $("editarMsg").innerHTML="";
 editItems.push({producto:nombre,cantidad:cant,precio_unitario:precio,precio_lista:precio,bonif_pct:0});
 $("edNuevoProd").value="";$("edNuevoCant").value="1";$("edNuevoPrecio").value="";
 renderEditItems();
}
async function guardarEdicion(){
 const o=orders.find(x=>x.id===editId);
 if(!o)return;
 const comercio=$("edComercio").value.trim();
 if(!comercio){$("editarMsg").innerHTML='<div class="err">El comercio no puede quedar vacío.</div>';return}
 if(!editItems.length){$("editarMsg").innerHTML='<div class="err">El pedido tiene que tener al menos un producto. Si hay que cancelarlo, usá "Anular pedido".</div>';return}
 const cambios={comercio,whatsapp:$("edWhatsapp").value.trim()||null,domicilio:$("edDomicilio").value.trim()||null,dia_entrega:$("edDia").value,observaciones:$("edObs").value.trim()||null};
 const nombres={comercio:"Comercio",whatsapp:"WhatsApp",domicilio:"Domicilio",dia_entrega:"Día de entrega",observaciones:"Observaciones"};
 const detalle=[];
 Object.keys(cambios).forEach(k=>{if((o[k]||null)!==(cambios[k]||null))detalle.push(nombres[k]+": "+(o[k]||"vacío")+" → "+(cambios[k]||"vacío"))});
 const body={...cambios};
 const fechaNueva=$("edFecha").value;
 if(fechaNueva&&fechaNueva!==fechaLocalISO(o.created_at)){
  // se cambia el día y se conserva la hora original del pedido
  const ant=new Date(o.created_at);
  const [y,m,d]=fechaNueva.split("-").map(Number);
  const nueva=new Date(y,m-1,d,ant.getHours(),ant.getMinutes(),ant.getSeconds());
  body.created_at=nueva.toISOString();
  detalle.push("Fecha del pedido: "+fechaLocalISO(o.created_at).split("-").reverse().join("/")+" → "+fechaNueva.split("-").reverse().join("/"));
 }
 let totalAntes=o.total,totalNuevo=o.total;
 if(!editBloqueado){
  const itemsAntes=JSON.stringify((o.productos||[]).map(it=>[it.producto,it.cantidad,it.precio_unitario]));
  const itemsAhora=JSON.stringify(editItems.map(it=>[it.producto,it.cantidad,it.precio_unitario]));
  if(itemsAntes!==itemsAhora){
   totalNuevo=totalEdit();
   body.productos=editItems;body.total=totalNuevo;
   detalle.push("Productos modificados · total de "+money(totalAntes)+" a "+(totalNuevo==null?"A confirmar":money(totalNuevo)));
  }
 }
 if(!detalle.length){$("editarMsg").innerHTML='<div class="ok">No hay cambios para guardar.</div>';return}
 $("editarGuardar").disabled=true;$("editarGuardar").textContent="Guardando...";
 try{
  const r=await apiFetch("/rest/v1/pedidos_distribuidora?id=eq."+editId,{method:"PATCH",headers:{"Prefer":"return=minimal"},body:JSON.stringify(body)});
  if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||"error "+r.status)}
  Object.assign(o,body);
  Audit.log(editId,"Pedido editado",detalle.join(" | "));
  $("editarModal").style.display="none";
  render();
 }catch(e){
  $("editarMsg").innerHTML='<div class="err">❌ No se pudo guardar: '+esc(e.message||"error desconocido")+'</div>';
  $("editarGuardar").disabled=false;$("editarGuardar").textContent="Guardar cambios";
 }
}
$("editarCerrar").addEventListener("click",()=>{$("editarModal").style.display="none"});
$("editarModal").addEventListener("click",e=>{if(e.target===$("editarModal"))$("editarModal").style.display="none"});
$("edAgregarBtn").addEventListener("click",editAgregar);
$("editarGuardar").addEventListener("click",guardarEdicion);

async function verHistorial(id){
 const o=orders.find(x=>x.id===id);
 $("historialTitulo").textContent="Historial · "+(o&&o.comercio?o.comercio:"Pedido "+id);
 $("historialBody").innerHTML='<div class="loading">Cargando...</div>';
 $("historialModal").style.display="flex";
 try{
  const eventos=await Audit.historial(id);
  const filas=eventos.map(e=>({fecha:e.creado_en,evento:e.evento,por:e.usuario_email,obs:e.detalle}));
  if(o)filas.push({fecha:o.created_at,evento:"Creado",por:o.manual?"Carga manual":"Cliente (web)",obs:"Pedido #"+o.id});
  $("historialBody").innerHTML='<table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr>'
   +'<th style="text-align:left;padding:6px 4px;border-bottom:2px solid var(--purple);font-size:11px;color:var(--muted);text-transform:uppercase">Fecha / Hora</th>'
   +'<th style="text-align:left;padding:6px 4px;border-bottom:2px solid var(--purple);font-size:11px;color:var(--muted);text-transform:uppercase">Evento</th>'
   +'<th style="text-align:left;padding:6px 4px;border-bottom:2px solid var(--purple);font-size:11px;color:var(--muted);text-transform:uppercase">Por</th>'
   +'<th style="text-align:left;padding:6px 4px;border-bottom:2px solid var(--purple);font-size:11px;color:var(--muted);text-transform:uppercase">Obs.</th></tr></thead><tbody>'
   +filas.map(f=>'<tr><td style="padding:7px 4px;border-bottom:1px dotted #eee1ef;white-space:nowrap">'+esc(new Date(f.fecha).toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"})+" "+new Date(f.fecha).toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"}))+'</td><td style="padding:7px 4px;border-bottom:1px dotted #eee1ef;font-weight:700">'+esc(f.evento)+'</td><td style="padding:7px 4px;border-bottom:1px dotted #eee1ef">'+esc(f.por)+'</td><td style="padding:7px 4px;border-bottom:1px dotted #eee1ef">'+esc(f.obs||"")+'</td></tr>').join("")
   +'</tbody></table><div style="font-size:11px;color:var(--muted);margin-top:8px">Los eventos anteriores a la activación de la auditoría no aparecen acá.</div>';
 }catch(e){
  $("historialBody").innerHTML='<div class="err">❌ '+esc(e.message||"No se pudo cargar")+' (¿ya corriste sql-auditoria.sql en Supabase?)</div>';
 }
}
$("historialCerrar").addEventListener("click",()=>{$("historialModal").style.display="none"});
$("historialModal").addEventListener("click",e=>{if(e.target.id==="historialModal")$("historialModal").style.display="none"});

document.querySelectorAll("[data-q]").forEach(btn=>btn.addEventListener("click",()=>{
 const hoy=new Date(),iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
 let d1=new Date(hoy),d2=new Date(hoy);
 if(btn.dataset.q==="semana"){const dow=(hoy.getDay()+6)%7;d1.setDate(hoy.getDate()-dow);d2=new Date(d1);d2.setDate(d1.getDate()+6)}
 if(btn.dataset.q==="mes"){d1=new Date(hoy.getFullYear(),hoy.getMonth(),1);d2=new Date(hoy.getFullYear(),hoy.getMonth()+1,0)}
 $("filtroDesde").value=iso(d1);$("filtroHasta").value=iso(d2);$("fechasBox").classList.add("open");paginaActual=1;render();
}));
$("filtroDesde").addEventListener("change",()=>{paginaActual=1;render();});
$("filtroHasta").addEventListener("change",()=>{paginaActual=1;render();});

 $("filtroDesde").value="";

});
