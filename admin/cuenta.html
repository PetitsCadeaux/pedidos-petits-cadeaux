<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#35265f">
<title>Cuenta Corriente - Petits Cadeaux</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap');
:root{--purple:#542477;--lilac:#a66ac7;--ink:#392541;--muted:#76657d;--line:#eaddea}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Inter,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#fff 0,transparent 30%),linear-gradient(180deg,#f8edf4,#fffafe 42%,#f8f0fa);min-height:100vh}
header{padding:16px;text-align:center;background:linear-gradient(180deg,#fff7fb,#f8eaf4);color:var(--purple);border-bottom:1px solid #ead9e8;box-shadow:0 7px 24px rgba(84,36,119,.08)}
header h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(22px,6vw,32px);font-weight:700}
.navlink{display:inline-block;margin-top:8px;color:#865a8e;font-size:13px;font-weight:700;text-decoration:none}
main{max-width:820px;margin:auto;padding:18px 14px 42px}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:0 10px 30px rgba(84,36,119,.08)}
label{display:block;margin-top:11px;color:#5f4d68;font-size:14px;font-weight:800}
input,select,textarea{width:100%;padding:14px 15px;margin-top:7px;border:1px solid #ddcfe1;border-radius:16px;background:#fff;color:var(--ink);font:500 16px Inter,Arial,sans-serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--lilac);box-shadow:0 0 0 4px rgba(166,106,199,.13)}
button{border:0;border-radius:15px;font:800 15px Inter,Arial,sans-serif;cursor:pointer}
.btn-main{width:100%;margin-top:16px;padding:15px;background:linear-gradient(135deg,#995ac2,#71369e);color:#fff;box-shadow:0 8px 20px rgba(113,54,158,.22)}
.btn-main:disabled{opacity:.6}
.err{background:#fff0f1;color:#9b3040;border:1px solid #f2ccd2;padding:12px 14px;border-radius:14px;margin-top:12px;font-weight:600;font-size:14px}
.ok{background:#ecfaf4;color:#176044;border:1px solid #ccefe0;padding:12px 14px;border-radius:14px;margin-top:12px;font-weight:600;font-size:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.search{margin-top:12px}
.client{border:1px solid #eee1ef;border-radius:18px;padding:15px 16px;margin-top:12px;background:linear-gradient(180deg,#fff,#fdf9fe);cursor:pointer}
.client-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.client-addr{font-weight:800;font-size:16px}
.client-shops{font-size:13px;color:var(--muted);margin-top:2px}
.saldo{text-align:right}
.saldo-val{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:700}
.saldo-val.debe{color:#a13030}
.saldo-val.saldado{color:#177a4d}
.saldo-label{font-size:11px;color:var(--muted);font-weight:700}
.detail{margin-top:14px;border-top:1px dashed #e6d9e8;padding-top:12px;display:none}
.detail.open{display:block}
.detail h4{margin:0 0 8px;font-size:13px;color:var(--purple);text-transform:uppercase;letter-spacing:.3px}
.mini-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed #f0e5f0}
.empty{padding:30px;text-align:center;color:#817287;background:#fbf7fc;border:1px dashed #dfd0e4;border-radius:16px;margin-top:14px}
.loading{text-align:center;padding:30px;color:var(--muted)}
.del-pago{background:none;border:0;color:#c0435a;font-size:12px;font-weight:700;padding:2px 6px}
.totales{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tot-stat{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:14px 15px;box-shadow:0 8px 22px rgba(84,36,119,.07)}
.tot-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.tot-value{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:700;color:var(--purple)}

.client{display:block;padding:12px 16px;margin-top:9px}
.client-top{align-items:center}
.client-cols{display:none}
.btn-cobrar{min-width:84px;padding:9px 16px;background:linear-gradient(135deg,#542477,#7d45a9);color:#fff;font-size:13px;white-space:nowrap}
.client-right{display:flex;align-items:center;gap:16px}
.saldo-val{font-size:23px}
.fchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{padding:9px 15px;border:1px solid #ddcde4;border-radius:13px;background:#fff;color:#654273;font:700 12px Inter,Arial,sans-serif;white-space:nowrap}
.chip.active{background:linear-gradient(135deg,#6d3a97,#9c61c5);color:#fff;border-color:#6d3a97}
.btn-top{padding:10px 16px;border-radius:13px;font:700 13px Inter,Arial,sans-serif;border:1px solid #ddcde4;background:#fff;color:#654273;cursor:pointer}
.btn-top.primary{background:linear-gradient(135deg,#995ac2,#71369e);color:#fff;border:0}
.modal-bg{position:fixed;inset:0;background:rgba(57,37,65,.55);display:none;align-items:center;justify-content:center;padding:14px;z-index:100}
.modal-bg.open{display:flex}
.modal-bg .card{width:100%;max-width:480px!important;max-height:92vh;overflow:auto;margin:0!important;position:relative}
.medios{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.medio{padding:11px 6px;border:1.5px solid #ddcde4;border-radius:13px;background:#fff;color:#654273;font:700 13px Inter,Arial,sans-serif;text-align:center}
.medio.sel{background:linear-gradient(135deg,#6d3a97,#9c61c5);color:#fff;border-color:#6d3a97}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.op-line{display:grid;grid-template-columns:1fr 130px;gap:10px;align-items:center;border-bottom:1px dotted #eee1ef;padding:8px 0;font-size:13px}
.op-line input{margin:0;padding:9px 10px;font-size:15px;text-align:right}
.badge-c{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10px;font-weight:800;margin-left:6px}
.badge-c.cob{background:#e6f7ee;color:#177a4d}
.badge-c.parcial{background:#e8f0fe;color:#1a56b0}
.badge-c.pend{background:#fff1de;color:#a15b00}
.modal-x{position:absolute;right:12px;top:10px;background:none;border:0;font-size:22px;color:#76657d;padding:4px 10px;cursor:pointer;width:auto;margin:0}
@media(min-width:1000px){
 .client-cols{display:flex;gap:30px;margin-right:6px}
 .client-cols div{text-align:right;min-width:92px;font-weight:700;font-size:14px}
 .client-cols span{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:800}
}
.btn-wa{border:1px solid #bfe3cf;background:#e9f8ef;color:#177a4d;border-radius:12px;padding:9px 11px;font-size:16px;cursor:pointer;margin-right:6px}
</style>
<link rel="stylesheet" href="ancho.css">
</head>
<body>

<header>
 <h1>Cuenta Corriente</h1>
</header>
<script src="menu.js"></script>

<main>

<div id="noSession" class="card" style="display:none;text-align:center">
 <p>Tenés que iniciar sesión primero en el panel de pedidos.</p>
 <a href="admin.html"><button class="btn-main">Ir a iniciar sesión</button></a>
</div>

<div id="content" style="display:none">

 <div class="totales" id="totales"></div>

 <div class="card">
  <div class="topbar">
   <strong id="countLabel">0 clientes</strong>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn-top primary" id="abrirCobranzaBtn">Registrar cobranza</button><button type="button" class="btn-top" id="abrirSaldoBtn">Cargar saldo anterior</button></div>
   <button class="logout" id="exportExcelBtn" style="padding:9px 15px;background:#fff;border:1px solid #ddcde4;color:#654273;border-radius:15px;font:800 13px Inter,Arial,sans-serif;cursor:pointer">⬇️ Exportar Excel</button>
  </div>
  <input id="searchClients" class="search" placeholder="🔎 Buscar por domicilio o comercio...">
  <div class="fchips" id="saldoFilters"><button type="button" class="chip active" data-f="todos">Todos</button><button type="button" class="chip" data-f="debe">Con saldo pendiente</button><button type="button" class="chip" data-f="aldia">Al día</button></div>
 </div>

 <div id="clientsList"></div>

 <div class="modal-bg" id="mCobranza">
 <div class="card">
  <button type="button" class="modal-x" data-close>✕</button>
  <h2 style="margin:0 0 10px;font-family:'Cormorant Garamond',serif;color:var(--purple);font-size:26px">Registrar cobranza</h2>
  <label>Cliente (domicilio)
   <select id="pagoDomicilio"><option value="">Seleccionar domicilio...</option></select>
  </label>
  <label>Monto que te pagó<input id="pagoMonto" type="number" min="0" step="0.01" inputmode="decimal" placeholder="Ej. 50000"></label>
  <div id="cobroInfo" style="font-size:12px;color:var(--muted);margin-top:6px"></div>
  <div id="cobroReparto"></div>
  <label>Medio de cobro</label>
  <div class="medios">
   <button type="button" class="medio" data-m="Efectivo">Efectivo</button>
   <button type="button" class="medio" data-m="Transferencia">Transferencia</button>
   <button type="button" class="medio" data-m="Mercado Pago">Mercado Pago</button>
  </div>
  <div class="row2"><label>Fecha<input id="pagoFecha" type="date"></label>
  <label>Referencia (opcional)<input id="pagoRef" placeholder="N° de transferencia…"></label></div>
  <label>Nota (opcional)<input id="pagoNota" placeholder="Ej. Seña, pago parcial..."></label>
  <button class="btn-main" id="guardarPagoBtn">Guardar cobranza</button>
  <div id="pagoMsg"></div>
 </div>
 </div>

 <div class="modal-bg" id="mSaldo">
 <div class="card">
  <button type="button" class="modal-x" data-close>✕</button>
  <h2 style="margin:0 0 10px;font-family:'Cormorant Garamond',serif;color:var(--purple);font-size:26px">Cargar saldo pendiente anterior</h2>
  <p style="margin:0;color:var(--muted);font-size:13px">Para sumar una deuda de un cliente que ya arrastraba desde antes de usar la app.</p>
  <label>Cliente (domicilio)
   <select id="saldoDomicilio"><option value="">Seleccionar domicilio...</option></select>
  </label>
  <label>Monto adeudado<input id="saldoMonto" type="number" min="0" inputmode="decimal" placeholder="Ej. 15000"></label>
  <label>Fecha<input id="saldoFecha" type="date"></label>
  <label>Nota (opcional)<input id="saldoNota" placeholder="Ej. Deuda anterior a la app"></label>
  <button class="btn-main" id="guardarSaldoBtn">Guardar saldo anterior</button>
  <div id="saldoMsg"></div>
 </div>
 </div>

</div>

</main>

<script src="permisos.js"></script>
<script src="paginacion.js"></script>

<script>
const SUPABASE_URL="https://stkfdzqwcnzievrmivaj.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0a2ZkenF3Y256aWV2cm1pdmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODM4MzIsImV4cCI6MjEwNDQ1OTgzMn0.rMlhM8TBZhtwroF3lOwRBB8LOyRplPgZQnsUWtjptsM";
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);
const normDom=d=>(d||"").trim().toLowerCase().replace(/\s+/g," ");

let session=JSON.parse(localStorage.getItem("admin_session")||"null");
let orders=[];
let pagos=[];
let saldosIniciales=[];
let links=[]; // imputaciones de cobranzas a pedidos (pagos_clientes_pedidos)
let clients=[];
let cobroMedio="";

// ---- Cobranzas: qué le falta cobrar a cada pedido ----
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function pedidoCobrado(o){
 return ["Efectivo","Transferencia","Mercado Pago"].includes(o.cobro)||(o.estado_pago==="Mercado Pago"&&!!o.pagado);
}
// Lo que falta cobrar de un pedido (0 si ya figura cobrado)
function faltaCobrar(o){
 if(o.total==null||pedidoCobrado(o))return 0;
 return Math.max(0,r2(o.total-(Number(o.cobrado_monto)||0)));
}
// Pedidos del cliente con algo por cobrar, del más antiguo al más nuevo
function pedidosPorCobrar(c){
 return c.pedidos.filter(o=>faltaCobrar(o)>0.005).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)||a.id-b.id);
}
// Saldo a favor que dejaron cobranzas anteriores hechas con la imputación automática (las viejas, sin medio, no cuentan)
function creditoDe(c){
 const imputado=pid=>links.filter(l=>l.pago_id===pid).reduce((s,l)=>s+(l.monto||0),0);
 return Math.max(0,r2((c.pagos||[]).filter(p=>p.medio).reduce((s,p)=>s+(p.monto||0)-imputado(p.id),0)));
}

// ---- WhatsApp: recordatorio de deuda ----
function waNumero(t){
 let d=String(t||"").replace(/\D/g,"").replace(/^0+/,"");
 if(!d)return"";
 if(d.startsWith("54")){if(!d.startsWith("549")&&d.length===12)d="549"+d.slice(2);return d}
 if(d.length===10)return"549"+d;
 if(d.length===12&&d.startsWith("15"))return d; // formato dudoso: se deja tal cual
 return d;
}
function recordatorioWA(key){
 const c=clients.find(x=>x.key===key);if(!c)return;
 const pend=pedidosPorCobrar(c);
 const conTel=c.pedidos.find(o=>o.whatsapp);
 const nombre=(c.comercios[0]||"").trim();
 const lineas=pend.slice(0,12).map(o=>"• "+fmtFechaCorta(o.created_at)+" – "+money(faltaCobrar(o))).join("\n");
 const resto=pend.length>12?"\n• y "+(pend.length-12)+" pedido"+(pend.length-12===1?"":"s")+" más":"";
 const saldoAnt=(c.saldos||[]).reduce((s,x)=>s+(x.monto||0),0);
 const msg="Hola"+(nombre?" "+nombre:"")+"! Te escribimos de Petits Cadeaux 🐞\n"
  +"Te pasamos el detalle de tu cuenta:\n"+(lineas?lineas+resto+"\n":"")
  +(saldoAnt>0.005?"• Saldo anterior – "+money(saldoAnt)+"\n":"")
  +"*Total a pagar: "+money(c.saldo)+"*\n"
  +"¿Nos confirmás cuándo podés abonarlo? Muchas gracias!";
 const num=waNumero(conTel&&conTel.whatsapp);
 window.open("https://wa.me/"+num+"?text="+encodeURIComponent(msg),"_blank");
}
let openKey=null;
let filtroSaldo="todos";

async function apiFetch(path,options={}){
 const r=await fetch(SUPABASE_URL+path,{
  ...options,
  headers:{
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer "+session.access_token,
   "Content-Type":"application/json",
   ...(options.headers||{})
  }
 });
 if(r.status===401){localStorage.removeItem("admin_session");location.href="admin.html";throw new Error("Sesión vencida")}
 return r;
}

function buildClients(){
 const map={};
 orders.forEach(o=>{
  if(!o.domicilio)return;
  const key=normDom(o.domicilio);
  if(!map[key])map[key]={key,domicilio:o.domicilio,comercios:new Set(),pedidos:[],debe:0,confirmar:false};
  map[key].comercios.add(o.comercio||"Sin nombre");
  map[key].pedidos.push(o);
  if(o.total==null)map[key].confirmar=true;
  else map[key].debe+=o.total;
 });
 pagos.forEach(p=>{
  const key=normDom(p.domicilio);
  if(!map[key])map[key]={key,domicilio:p.domicilio,comercios:new Set(),pedidos:[],debe:0,confirmar:false};
  if(!map[key].pagos)map[key].pagos=[];
  map[key].pagos.push(p);
 });
 saldosIniciales.forEach(s=>{
  const key=normDom(s.domicilio);
  if(!map[key])map[key]={key,domicilio:s.domicilio,comercios:new Set(),pedidos:[],debe:0,confirmar:false};
  if(!map[key].saldos)map[key].saldos=[];
  map[key].saldos.push(s);
  map[key].debe+=(s.monto||0);
 });
 clients=Object.values(map).map(c=>{
  const haber=(c.pagos||[]).reduce((s,p)=>s+(p.monto||0),0);
  return {...c,comercios:[...c.comercios],pagos:c.pagos||[],saldos:c.saldos||[],haber,saldo:c.debe-haber};
 }).sort((a,b)=>b.saldo-a.saldo);
}

function renderTotales(){
 const totalDebe=clients.reduce((s,c)=>s+c.debe,0);
 const totalHaber=clients.reduce((s,c)=>s+c.haber,0);
 const totalSaldo=totalDebe-totalHaber;
 $("totales").innerHTML=`
  <div class="tot-stat"><div class="tot-label">Total facturado</div><div class="tot-value">${money(totalDebe)}</div></div>
  <div class="tot-stat"><div class="tot-label">Total cobrado</div><div class="tot-value">${money(totalHaber)}</div></div>
  <div class="tot-stat"><div class="tot-label">Saldo total pendiente</div><div class="tot-value">${money(totalSaldo)}</div></div>
 `;
}

function fillDomicilioSelect(){
 const opts=clients.map(c=>`<option value="${c.domicilio.replace(/"/g,'&quot;')}">${c.domicilio}</option>`).join("");
 $("pagoDomicilio").innerHTML='<option value="">Seleccionar domicilio...</option>'+opts;
 $("saldoDomicilio").innerHTML='<option value="">Seleccionar domicilio...</option>'+opts;
}

function fmtFechaCorta(iso){
 const d=new Date(iso);
 return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit",year:"2-digit"});
}

function renderClients(){
 const term=($("searchClients").value||"").toLowerCase().trim();
 const visible=clients.filter(c=>(!term||c.domicilio.toLowerCase().includes(term)||c.comercios.some(s=>s.toLowerCase().includes(term)))&&(filtroSaldo==="todos"||(filtroSaldo==="debe"?c.saldo>0:c.saldo<=0)));

 $("countLabel").textContent=visible.length+" "+(visible.length===1?"cliente":"clientes");

 const pagina=Pag.page("cuenta",visible,$("clientsList"),renderClients);
 if(!visible.length){$("clientsList").innerHTML='<div class="empty">No hay clientes para mostrar.</div>';return}

 $("clientsList").innerHTML=pagina.map(c=>{
  const saldado=c.saldo<=0;
  const open=openKey===c.key;
  const pedidosHtml=c.pedidos.slice().sort((a,b)=>new Date(b.created_at)-new Date(a.created_at)).map(o=>
   {
    const cobr=pedidoCobrado(o),falta=faltaCobrar(o),parcial=!cobr&&(Number(o.cobrado_monto)||0)>0.005;
    const est=o.total==null?"":cobr?'<span class="badge-c cob">Cobrado</span>':parcial?'<span class="badge-c parcial">Cobrado parcial · falta '+money(falta)+'</span>':'<span class="badge-c pend">Por cobrar</span>';
    return `<div class="mini-row"><span>${fmtFechaCorta(o.created_at)} · ${esc(o.comercio||"-")} ${est}</span><span>${o.total==null?"A confirmar":money(o.total)}</span></div>`;
   }
  ).join("")||'<div class="mini-row"><span>Sin pedidos registrados</span></div>';
  const credito=creditoDe(c);
  const pagosHtml=(credito>0.005?`<div class="mini-row" style="color:#177a4d;font-weight:700"><span>Saldo a favor disponible (se usa en la próxima cobranza)</span><span>${money(credito)}</span></div>`:"")+c.pagos.slice().sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)||b.id-a.id).map(p=>{
   const imp=links.filter(l=>l.pago_id===p.id).length;
   const det=[p.medio,p.referencia,p.nota].filter(Boolean).map(esc).join(" · ");
   return `<div class="mini-row"><span>${p.fecha}${det?" · "+det:""}${imp?` · aplicada a ${imp} pedido${imp===1?"":"s"}`:""}</span><span>${money(p.monto)} <button class="del-pago" title="${p.medio?"Anular (los pedidos vuelven a por cobrar)":"Borrar"}" onclick="event.stopPropagation();borrarPago(${p.id},${p.medio?"true":"false"})">✕</button></span></div>`;
  }).join("")||'<div class="mini-row"><span>Sin cobranzas registradas</span></div>';
  const saldosHtml=(c.saldos||[]).slice().sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).map(s=>
   `<div class="mini-row"><span>${s.fecha} ${s.nota?"· "+s.nota:""}</span><span>${money(s.monto)} <button class="del-pago" onclick="event.stopPropagation();borrarSaldo(${s.id})">✕</button></span></div>`
  ).join("")||'';

  return `<div class="client" onclick="toggleClient('${c.key.replace(/'/g,"\\'")}')">
   <div class="client-top">
    <div>
     <div class="client-addr">📍 ${c.domicilio}</div>
     <div class="client-shops">${c.comercios.join(", ")} · ${c.pedidos.length} pedido${c.pedidos.length===1?"":"s"}</div>
    </div>
    <div class="client-right">
     <div class="client-cols"><div><span>Facturado</span>${money(c.debe)}</div><div><span>Cobrado</span>${money(c.haber)}</div></div>
     <div class="saldo">
      <div class="saldo-label">${saldado?"Al día":"Debe"}</div>
      <div class="saldo-val ${saldado?"saldado":"debe"}">${money(Math.abs(c.saldo))}</div>
     </div>
     ${saldado?'<span style="width:84px"></span>':`<button type="button" class="btn-wa" title="Enviar recordatorio de deuda por WhatsApp" onclick="event.stopPropagation();recordatorioWA('${c.key.replace(/'/g,"\\'")}')">💬</button><button type="button" class="btn-cobrar" onclick="event.stopPropagation();abrirCobranza('${c.key.replace(/'/g,"\\'")}')">Cobrar</button>`}
    </div>
   </div>
   <div class="detail ${open?"open":""}">
    <h4>Pedidos</h4>
    ${pedidosHtml}
    ${saldosHtml?`<h4 style="margin-top:12px">Saldo pendiente anterior</h4>${saldosHtml}`:""}
    <h4 style="margin-top:12px">Cobranzas registradas</h4>
    ${pagosHtml}
    <button onclick="event.stopPropagation();window.open('estado-cuenta.html?domicilio=${encodeURIComponent(c.domicilio)}','_blank')" style="margin-top:12px;width:100%;padding:11px;background:linear-gradient(135deg,#542477,#7d45a9);color:#fff;border:0;border-radius:14px;font:800 13px Inter,Arial,sans-serif;cursor:pointer">📄 Estado de cuenta (para enviar / PDF)</button>
   </div>
  </div>`;
 }).join("");
}

function toggleClient(key){
 openKey=openKey===key?null:key;
 renderClients();
}

async function cargarTodo(){
 $("clientsList").innerHTML='<div class="loading">Cargando...</div>';
 try{
  const [rOrders,rPagos,rSaldos,rLinks]=await Promise.all([
   apiFetch("/rest/v1/pedidos_distribuidora?select=*&order=created_at.desc"),
   apiFetch("/rest/v1/pagos_clientes?select=*&order=fecha.desc"),
   apiFetch("/rest/v1/saldos_iniciales?select=*&order=fecha.desc"),
   apiFetch("/rest/v1/pagos_clientes_pedidos?select=pago_id,pedido_id,monto")
  ]);
  orders=(await rOrders.json()).filter(o=>!o.anulado);
  pagos=await rPagos.json();
  saldosIniciales=await rSaldos.json();
  // Si todavía no se corrió sql-cobranzas-clientes.sql, la tabla no existe: la pantalla sigue funcionando como antes.
  links=rLinks.ok?await rLinks.json():[];
  if(!Array.isArray(links))links=[];
  buildClients();
  renderTotales();
  fillDomicilioSelect();
  renderClients();
 }catch(e){
  $("clientsList").innerHTML='<div class="err">❌ '+(e.message||"Error al cargar datos")+'</div>';
 }
}

// ---- Registrar cobranza: se reparte entre los pedidos más antiguos sin cobrar ----
function clienteDelModal(){const d=$("pagoDomicilio").value;return d?clients.find(x=>x.key===normDom(d)):null}
function renderRepartoCobro(){
 const c=clienteDelModal(),box=$("cobroReparto"),info=$("cobroInfo");
 if(!c){box.innerHTML="";info.textContent="";return}
 const lista=pedidosPorCobrar(c),credito=creditoDe(c);
 info.innerHTML=(lista.length?"Pendiente de cobro en pedidos: <b>"+money(lista.reduce((s,o)=>s+faltaCobrar(o),0))+"</b>. ":"No hay pedidos pendientes de cobro. ")
  +(credito>0.005?'Saldo a favor disponible: <b style="color:#177a4d">'+money(credito)+"</b> (se suma al reparto).":"");
 box.innerHTML=lista.length?'<div style="font-size:12px;color:var(--muted);margin-top:10px">Se aplica primero a los pedidos <b>más antiguos</b>. Podés cambiar el reparto a mano.</div><div style="margin-top:6px">'
  +lista.map(o=>`<div class="op-line"><div><strong>${fmtFechaCorta(o.created_at)}</strong> · ${esc(o.comercio||"-")} · Pedido #${o.id}<br><span style="color:var(--muted)">Falta cobrar ${money(faltaCobrar(o))}</span></div><input type="number" step="0.01" min="0" data-cobro="${o.id}" placeholder="0" oninput="resumenCobro()"></div>`).join("")
  +'</div><div id="cobroResumen" style="margin-top:8px;font-weight:700;font-size:13px"></div>':"";
 repartirCobro();
}
function repartirCobro(){
 const c=clienteDelModal();if(!c)return;
 let resto=r2((parseFloat($("pagoMonto").value)||0)+creditoDe(c));
 document.querySelectorAll("[data-cobro]").forEach(inp=>{
  const o=c.pedidos.find(x=>x.id===+inp.dataset.cobro);
  const aplica=Math.min(resto,faltaCobrar(o));
  inp.value=aplica>0.004?r2(aplica):"";
  resto=r2(resto-aplica);
 });
 resumenCobro();
}
function resumenCobro(){
 const el=$("cobroResumen");if(!el)return;
 const c=clienteDelModal();if(!c)return;
 const monto=r2(parseFloat($("pagoMonto").value)||0),credito=creditoDe(c);
 const aplicado=r2([...document.querySelectorAll("[data-cobro]")].reduce((s,i)=>s+(parseFloat(i.value)||0),0));
 const disponible=r2(monto+credito),sobra=r2(disponible-aplicado);
 if(sobra<-0.005){el.innerHTML='<span style="color:#9b3040">Repartiste '+money(aplicado)+', más que lo disponible ('+money(disponible)+').</span>';return}
 el.innerHTML='Aplicado a pedidos: <b>'+money(aplicado)+'</b>'+(sobra>0.005?' · <span style="color:#177a4d">Queda a favor del cliente: <b>'+money(sobra)+'</b></span>':"");
}
document.querySelectorAll(".medio").forEach(b=>b.addEventListener("click",()=>{
 cobroMedio=b.dataset.m;
 document.querySelectorAll(".medio").forEach(x=>x.classList.toggle("sel",x===b));
}));
$("pagoDomicilio").addEventListener("change",renderRepartoCobro);
$("pagoMonto").addEventListener("input",repartirCobro);

async function guardarPago(){
 const domicilio=$("pagoDomicilio").value;
 const monto=r2(parseFloat($("pagoMonto").value)||0);
 const fecha=$("pagoFecha").value;
 const nota=$("pagoNota").value.trim();
 const ref=$("pagoRef").value.trim();
 $("pagoMsg").innerHTML="";
 if(!domicilio)return $("pagoMsg").innerHTML='<div class="err">Elegí un cliente.</div>';
 if(!monto||monto<=0)return $("pagoMsg").innerHTML='<div class="err">Ingresá un monto válido.</div>';
 if(!cobroMedio)return $("pagoMsg").innerHTML='<div class="err">Elegí el medio de cobro.</div>';
 if(!fecha)return $("pagoMsg").innerHTML='<div class="err">Elegí una fecha.</div>';
 const c=clienteDelModal();
 const items=[...document.querySelectorAll("[data-cobro]")].map(i=>({pedido_id:+i.dataset.cobro,monto:r2(parseFloat(i.value)||0)})).filter(x=>x.monto>0);
 const aplicado=r2(items.reduce((s,i)=>s+i.monto,0));
 if(aplicado>r2(monto+(c?creditoDe(c):0))+0.005)return $("pagoMsg").innerHTML='<div class="err">Repartiste más de lo disponible.</div>';
 for(const it of items){
  const o=c&&c.pedidos.find(x=>x.id===it.pedido_id);
  if(!o||it.monto>faltaCobrar(o)+0.005)return $("pagoMsg").innerHTML='<div class="err">Un monto supera lo que falta cobrar de un pedido.</div>';
 }

 $("guardarPagoBtn").disabled=true;$("guardarPagoBtn").textContent="Guardando...";
 try{
  const r=await apiFetch("/rest/v1/rpc/registrar_cobranza",{method:"POST",body:JSON.stringify({
   p_domicilio:domicilio,p_fecha:fecha,p_medio:cobroMedio,p_referencia:ref,p_nota:nota,p_monto:monto,p_items:items})});
  const data=await r.json().catch(()=>null);
  if(!r.ok){
   const m=(data&&(data.message||data.hint))||"error";
   throw new Error(/function|schema cache|does not exist|column/i.test(m)?"Falta correr el SQL nuevo en Supabase (sql-cobranzas-clientes.sql).":m);
  }
  try{if(window.Audit)Audit.log(null,"Cobranza de cliente registrada",domicilio+" · "+money(monto)+" · "+cobroMedio+(items.length?" · aplicada a "+items.length+" pedido(s) más antiguos":"")+" · cobranza N° "+data)}catch(e){}
  $("pagoMsg").innerHTML='<div class="ok">✅ Cobranza registrada'+(items.length?" y aplicada a "+items.length+" pedido"+(items.length===1?"":"s"):"")+'.</div>';
  $("pagoMonto").value="";$("pagoNota").value="";$("pagoRef").value="";
  await cargarTodo();
  setTimeout(cerrarModales,900);
 }catch(e){
  $("pagoMsg").innerHTML='<div class="err">❌ '+(e.message||"No se pudo guardar")+'</div>';
 }
 $("guardarPagoBtn").disabled=false;$("guardarPagoBtn").textContent="Guardar cobranza";
}

async function borrarPago(id,nueva){
 if(!confirm(nueva?"¿Anular esta cobranza? Los pedidos que cubría vuelven a quedar por cobrar.":"¿Borrar esta cobranza?"))return;
 try{
  if(nueva){
   const r=await apiFetch("/rest/v1/rpc/anular_cobranza",{method:"POST",body:JSON.stringify({p_pago:id})});
   if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.message||"error")}
   try{if(window.Audit)Audit.log(null,"Cobranza de cliente anulada","Cobranza N° "+id)}catch(e){}
  }else{
   await apiFetch("/rest/v1/pagos_clientes?id=eq."+id,{method:"DELETE",headers:{"Prefer":"return=minimal"}});
  }
  await cargarTodo();
 }catch(e){
  alert("No se pudo completar: "+(e.message||"error desconocido"));
 }
}

async function guardarSaldo(){
 const domicilio=$("saldoDomicilio").value;
 const monto=parseFloat($("saldoMonto").value);
 const fecha=$("saldoFecha").value;
 const nota=$("saldoNota").value.trim();
 $("saldoMsg").innerHTML="";
 if(!domicilio)return $("saldoMsg").innerHTML='<div class="err">Elegí un cliente.</div>';
 if(!monto||monto<=0)return $("saldoMsg").innerHTML='<div class="err">Ingresá un monto válido.</div>';
 if(!fecha)return $("saldoMsg").innerHTML='<div class="err">Elegí una fecha.</div>';

 $("guardarSaldoBtn").disabled=true;$("guardarSaldoBtn").textContent="Guardando...";
 try{
  await apiFetch("/rest/v1/saldos_iniciales",{
   method:"POST",
   headers:{"Prefer":"return=minimal"},
   body:JSON.stringify({domicilio,monto,fecha,nota:nota||null})
  });
  $("saldoMsg").innerHTML='<div class="ok">✅ Saldo anterior cargado.</div>';
  $("saldoMonto").value="";$("saldoNota").value="";
  await cargarTodo();
  setTimeout(cerrarModales,900);
 }catch(e){
  $("saldoMsg").innerHTML='<div class="err">❌ '+(e.message||"No se pudo guardar")+'</div>';
 }
 $("guardarSaldoBtn").disabled=false;$("guardarSaldoBtn").textContent="Guardar saldo anterior";
}

async function borrarSaldo(id){
 if(!confirm("¿Borrar este saldo pendiente anterior?"))return;
 try{
  await apiFetch("/rest/v1/saldos_iniciales?id=eq."+id,{method:"DELETE",headers:{"Prefer":"return=minimal"}});
  await cargarTodo();
 }catch(e){
  alert("No se pudo borrar: "+(e.message||"error desconocido"));
 }
}

function exportarExcel(){
 if(!clients.length){alert("No hay clientes para exportar.");return}
 let csv="Domicilio,Comercios,Pedidos,Debe,Haber,Saldo\n";
 clients.forEach(c=>{
  csv+=`"${c.domicilio}","${c.comercios.join(" / ")}",${c.pedidos.length},${c.debe},${c.haber},${c.saldo}\n`;
 });
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="cuenta_corriente_"+new Date().toISOString().slice(0,10)+".csv";
 a.click();
 URL.revokeObjectURL(url);
}

function abrirModal(id){document.getElementById(id).classList.add("open")}
function cerrarModales(){document.querySelectorAll(".modal-bg.open").forEach(m=>m.classList.remove("open"));$("pagoMsg").innerHTML="";$("saldoMsg").innerHTML=""}
function abrirCobranza(key){
 const c=key?clients.find(x=>x.key===key):null;
 $("pagoDomicilio").value=c?c.domicilio:"";
 $("pagoMonto").value=c&&c.saldo>0?Math.round(c.saldo):"";
 $("pagoMsg").innerHTML="";
 cobroMedio="";document.querySelectorAll(".medio").forEach(x=>x.classList.remove("sel"));
 renderRepartoCobro();
 abrirModal("mCobranza");
 setTimeout(()=>(c?$("pagoMonto"):$("pagoDomicilio")).focus(),50);
}
$("abrirCobranzaBtn").addEventListener("click",()=>abrirCobranza(null));
$("abrirSaldoBtn").addEventListener("click",()=>{$("saldoMsg").innerHTML="";abrirModal("mSaldo")});
document.querySelectorAll(".modal-bg").forEach(m=>m.addEventListener("click",e=>{if(e.target===m||e.target.hasAttribute("data-close"))cerrarModales()}));
document.addEventListener("keydown",e=>{if(e.key==="Escape")cerrarModales()});
document.querySelectorAll("#saldoFilters .chip").forEach(b=>b.addEventListener("click",()=>{filtroSaldo=b.dataset.f;Pag.reset("cuenta");document.querySelectorAll("#saldoFilters .chip").forEach(x=>x.classList.toggle("active",x===b));renderClients()}));
$("guardarPagoBtn").addEventListener("click",guardarPago);
$("guardarSaldoBtn").addEventListener("click",guardarSaldo);
$("searchClients").addEventListener("input",()=>{Pag.reset("cuenta");renderClients()});
$("exportExcelBtn").addEventListener("click",exportarExcel);
$("pagoFecha").value=new Date().toISOString().slice(0,10);
$("saldoFecha").value=new Date().toISOString().slice(0,10);

if(session){
 $("content").style.display="block";
 cargarTodo();
}else{
 $("noSession").style.display="block";
}
