<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#35265f">
<title>Facturas Proveedor - Petits Cadeaux</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--purple:#542477;--lilac:#a66ac7;--ink:#392541;--muted:#76657d;--line:#eaddea}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Poppins,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#fff 0,transparent 30%),linear-gradient(180deg,#f8edf4,#fffafe 42%,#f8f0fa);min-height:100vh}
header{padding:16px;text-align:center;background:linear-gradient(180deg,#fff7fb,#f8eaf4);color:var(--purple);border-bottom:1px solid #ead9e8;box-shadow:0 7px 24px rgba(84,36,119,.08)}
header h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(22px,6vw,32px);font-weight:700}
.navlink{display:inline-block;margin-top:8px;color:#865a8e;font-size:13px;font-weight:700;text-decoration:none}
main{max-width:820px;margin:auto;padding:18px 14px 42px}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:0 10px 30px rgba(84,36,119,.08)}
label{display:block;margin-top:11px;color:#5f4d68;font-size:14px;font-weight:800}
input,select{width:100%;padding:14px 15px;margin-top:7px;border:1px solid #ddcfe1;border-radius:16px;background:#fff;color:var(--ink);font:500 16px Poppins,Arial,sans-serif;outline:none}
input:focus,select:focus{border-color:var(--lilac);box-shadow:0 0 0 4px rgba(166,106,199,.13)}
button{border:0;border-radius:15px;font:800 15px Poppins,Arial,sans-serif;cursor:pointer}
.btn-main{width:100%;margin-top:16px;padding:15px;background:linear-gradient(135deg,#995ac2,#71369e);color:#fff;box-shadow:0 8px 20px rgba(113,54,158,.22)}
.btn-main:disabled{opacity:.6}
.err{background:#fff0f1;color:#9b3040;border:1px solid #f2ccd2;padding:12px 14px;border-radius:14px;margin-top:12px;font-weight:600;font-size:14px}
.ok{background:#ecfaf4;color:#176044;border:1px solid #ccefe0;padding:12px 14px;border-radius:14px;margin-top:12px;font-weight:600;font-size:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.search{margin-top:12px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 4px;margin:12px 0 0}
.chip{padding:9px 15px;border:1px solid #ddcde4;border-radius:13px;background:#fff;color:#654273;font:700 12px Poppins,Arial,sans-serif;white-space:nowrap}
.chip.active{background:linear-gradient(135deg,#6d3a97,#9c61c5);color:#fff;border-color:#6d3a97}
.factura{border:1px solid #eee1ef;border-radius:18px;padding:15px 16px;margin-top:12px;background:linear-gradient(180deg,#fff,#fdf9fe)}
.factura.pagada{opacity:.68}
.factura-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.factura-prov{font-weight:800;font-size:16px}
.factura-meta{font-size:13px;color:var(--muted);margin-top:2px}
.factura-importe{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:700;color:var(--purple);margin-top:8px}
.badge{padding:5px 11px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.badge.pendiente{background:#fff1de;color:#a15b00}
.badge.pagada{background:#e6f7ee;color:#177a4d}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.actions button{padding:10px 14px;font-size:13px}
.btn-pay{background:linear-gradient(135deg,#542477,#7d45a9);color:#fff;flex:1}
.btn-del{background:none;border:1px solid #f2ccd2;color:#9b3040}
.empty{padding:30px;text-align:center;color:#817287;background:#fbf7fc;border:1px dashed #dfd0e4;border-radius:16px;margin-top:14px}
.loading{text-align:center;padding:30px;color:var(--muted)}
.totales{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tot-stat{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:14px 15px;box-shadow:0 8px 22px rgba(84,36,119,.07)}
.tot-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.tot-value{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:700;color:var(--purple)}
</style>
</head>
<body>

<header>
 <h1>🧾 Facturas del Proveedor</h1>
 <a class="navlink" href="admin.html">← Volver al panel de pedidos</a> &nbsp;·&nbsp; <a class="navlink" href="costos.html">💰 Costos y márgenes</a>
</header>

<main>

<div id="noSession" class="card" style="display:none;text-align:center">
 <p>Tenés que iniciar sesión primero en el panel de pedidos.</p>
 <a href="admin.html"><button class="btn-main">Ir a iniciar sesión</button></a>
</div>

<div id="content" style="display:none">

 <div class="totales" id="totales"></div>

 <div class="card">
  <h2 style="margin:0 0 10px;font-family:'Cormorant Garamond',serif;color:var(--purple);font-size:26px">Cargar factura</h2>
  <label>Proveedor<input id="fProveedor" placeholder="Ej. Distribuidora XX"></label>
  <label>Descripción (opcional)<input id="fDescripcion" placeholder="Ej. Factura N° 0001-00023"></label>
  <label>Importe<input id="fImporte" type="number" min="0" inputmode="decimal" placeholder="Ej. 50000"></label>
  <label>Fecha<input id="fFecha" type="date"></label>
  <label>Foto o PDF de la factura/remito (opcional)<input id="fArchivo" type="file" accept="image/*,application/pdf"></label>
  <button class="btn-main" id="guardarFacturaBtn">Guardar factura</button>
  <div id="facturaMsg"></div>
 </div>

 <div class="card">
  <div class="topbar">
   <strong id="countLabel">0 facturas</strong>
  </div>
  <div class="filters" id="estadoFilters">
   <button type="button" class="chip active" data-f="Todas">Todas</button>
   <button type="button" class="chip" data-f="Pendiente">Pendientes</button>
   <button type="button" class="chip" data-f="Pagada">Pagadas</button>
  </div>
 </div>

 <div id="facturasList"></div>

</div>

</main>

<script>
const SUPABASE_URL="https://stkfdzqwcnzievrmivaj.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0a2ZkenF3Y256aWV2cm1pdmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODM4MzIsImV4cCI6MjEwNDQ1OTgzMn0.rMlhM8TBZhtwroF3lOwRBB8LOyRplPgZQnsUWtjptsM";
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);

let session=JSON.parse(localStorage.getItem("admin_session")||"null");
let facturas=[];
let estadoFilter="Todas";

async function apiFetch(path,options={}){
 const r=await fetch(SUPABASE_URL+path,{
  ...options,
  headers:{
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer "+session.access_token,
   "Content-Type":"application/json",
   ...(options.headers||{})
  }
 });
 if(r.status===401){localStorage.removeItem("admin_session");location.href="admin.html";throw new Error("Sesión vencida")}
 return r;
}

function renderTotales(){
 const total=facturas.reduce((s,f)=>s+(f.importe||0),0);
 const pagado=facturas.filter(f=>f.pagada).reduce((s,f)=>s+(f.importe||0),0);
 const pendiente=total-pagado;
 $("totales").innerHTML=`
  <div class="tot-stat"><div class="tot-label">Total facturado</div><div class="tot-value">${money(total)}</div></div>
  <div class="tot-stat"><div class="tot-label">Total pagado</div><div class="tot-value">${money(pagado)}</div></div>
  <div class="tot-stat"><div class="tot-label">Pendiente de pago</div><div class="tot-value">${money(pendiente)}</div></div>
 `;
}

function fmtFechaCorta(iso){
 if(!iso)return "-";
 const [y,m,d]=iso.split("-");
 return `${d}/${m}/${y.slice(2)}`;
}

function renderFacturas(){
 const visible=facturas.filter(f=>{
  if(estadoFilter==="Todas")return true;
  if(estadoFilter==="Pagada")return f.pagada;
  return !f.pagada;
 });

 $("countLabel").textContent=visible.length+" "+(visible.length===1?"factura":"facturas");

 if(!visible.length){$("facturasList").innerHTML='<div class="empty">No hay facturas para mostrar.</div>';return}

 $("facturasList").innerHTML=visible.map(f=>{
  return `<div class="factura ${f.pagada?"pagada":""}">
   <div class="factura-top">
    <div>
     <div class="factura-prov">${f.proveedor||"Sin nombre"}</div>
     <div class="factura-meta">📅 ${fmtFechaCorta(f.fecha)}${f.descripcion?" · "+f.descripcion:""}</div>
    </div>
    <span class="badge ${f.pagada?"pagada":"pendiente"}">${f.pagada?"Pagada":"Pendiente"}</span>
   </div>
   <div class="factura-importe">${money(f.importe)}</div>
   <div class="actions">
    ${!f.pagada?`<button class="btn-pay" onclick="marcarPagada(${f.id},this)">Marcar como pagada</button>`:""}
    ${f.archivo_url?`<button class="btn-del" onclick="window.open('${f.archivo_url}','_blank')">📎 Ver archivo</button>`:""}
    <button class="btn-del" onclick="borrarFactura(${f.id})">Borrar</button>
   </div>
  </div>`;
 }).join("");
}

async function cargarFacturas(){
 $("facturasList").innerHTML='<div class="loading">Cargando...</div>';
 try{
  const r=await apiFetch("/rest/v1/facturas_proveedor?select=*&order=fecha.desc");
  facturas=await r.json();
  renderTotales();
  renderFacturas();
 }catch(e){
  $("facturasList").innerHTML='<div class="err">❌ '+(e.message||"Error al cargar facturas")+'</div>';
 }
}

async function subirArchivo(file){
 const ext=file.name.split(".").pop();
 const path="factura-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+"."+ext;
 const r=await fetch(SUPABASE_URL+"/storage/v1/object/facturas-proveedor/"+path,{
  method:"POST",
  headers:{"Authorization":"Bearer "+session.access_token,"apikey":SUPABASE_KEY,"Content-Type":file.type||"application/octet-stream"},
  body:file
 });
 if(!r.ok){const err=await r.json().catch(()=>({}));throw new Error(err.message||"No se pudo subir el archivo")}
 return SUPABASE_URL+"/storage/v1/object/public/facturas-proveedor/"+path;
}

async function guardarFactura(){
 const proveedor=$("fProveedor").value.trim();
 const descripcion=$("fDescripcion").value.trim();
 const importe=parseFloat($("fImporte").value);
 const fecha=$("fFecha").value;
 $("facturaMsg").innerHTML="";
 if(!proveedor)return $("facturaMsg").innerHTML='<div class="err">Ingresá el nombre del proveedor.</div>';
 if(!importe||importe<=0)return $("facturaMsg").innerHTML='<div class="err">Ingresá un importe válido.</div>';
 if(!fecha)return $("facturaMsg").innerHTML='<div class="err">Elegí una fecha.</div>';

 $("guardarFacturaBtn").disabled=true;$("guardarFacturaBtn").textContent="Guardando...";
 try{
  let archivo_url=null;
  const file=$("fArchivo").files[0];
  if(file){
   $("guardarFacturaBtn").textContent="Subiendo archivo...";
   archivo_url=await subirArchivo(file);
  }
  await apiFetch("/rest/v1/facturas_proveedor",{
   method:"POST",
   headers:{"Prefer":"return=minimal"},
   body:JSON.stringify({proveedor,descripcion:descripcion||null,importe,fecha,pagada:false,archivo_url})
  });
  $("facturaMsg").innerHTML='<div class="ok">✅ Factura registrada.</div>';
  $("fDescripcion").value="";$("fImporte").value="";$("fArchivo").value="";
  await cargarFacturas();
 }catch(e){
  $("facturaMsg").innerHTML='<div class="err">❌ '+(e.message||"No se pudo guardar")+'</div>';
 }
 $("guardarFacturaBtn").disabled=false;$("guardarFacturaBtn").textContent="Guardar factura";
}

async function marcarPagada(id,btn){
 btn.disabled=true;btn.textContent="Guardando...";
 try{
  const hoy=new Date().toISOString().slice(0,10);
  await apiFetch("/rest/v1/facturas_proveedor?id=eq."+id,{
   method:"PATCH",
   headers:{"Prefer":"return=minimal"},
   body:JSON.stringify({pagada:true,fecha_pago:hoy})
  });
  await cargarFacturas();
 }catch(e){
  alert("No se pudo actualizar: "+(e.message||"error desconocido"));
  btn.disabled=false;btn.textContent="Marcar como pagada";
 }
}

async function borrarFactura(id){
 if(!confirm("¿Borrar esta factura?"))return;
 try{
  await apiFetch("/rest/v1/facturas_proveedor?id=eq."+id,{method:"DELETE",headers:{"Prefer":"return=minimal"}});
  await cargarFacturas();
 }catch(e){
  alert("No se pudo borrar: "+(e.message||"error desconocido"));
 }
}

document.querySelectorAll("#estadoFilters .chip").forEach(btn=>{
 btn.addEventListener("click",()=>{
  estadoFilter=btn.dataset.f;
  document.querySelectorAll("#estadoFilters .chip").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderFacturas();
 });
});

$("guardarFacturaBtn").addEventListener("click",guardarFactura);
$("fFecha").value=new Date().toISOString().slice(0,10);

if(session){
 $("content").style.display="block";
 cargarFacturas();
}else{
 $("noSession").style.display="block";
}
</script>
</body>
</html>
