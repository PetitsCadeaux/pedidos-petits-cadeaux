<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#35265f">
<title>Cuenta Corriente Proveedor - Petits Cadeaux</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--purple:#542477;--lilac:#a66ac7;--ink:#392541;--muted:#76657d;--line:#eaddea}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Poppins,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#fff 0,transparent 30%),linear-gradient(180deg,#f8edf4,#fffafe 42%,#f8f0fa);min-height:100vh}
header{padding:16px;text-align:center;background:linear-gradient(180deg,#fff7fb,#f8eaf4);color:var(--purple);border-bottom:1px solid #ead9e8;box-shadow:0 7px 24px rgba(84,36,119,.08)}
header h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(22px,6vw,32px);font-weight:700}
.navlink{display:inline-block;margin-top:8px;color:#865a8e;font-size:13px;font-weight:700;text-decoration:none}
main{max-width:820px;margin:auto;padding:18px 14px 42px}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:0 10px 30px rgba(84,36,119,.08)}
label{display:block;margin-top:11px;color:#5f4d68;font-size:14px;font-weight:800}
input,select{width:100%;padding:14px 15px;margin-top:7px;border:1px solid #ddcfe1;border-radius:16px;background:#fff;color:var(--ink);font:500 16px Poppins,Arial,sans-serif;outline:none}
input:focus,select:focus{border-color:var(--lilac);box-shadow:0 0 0 4px rgba(166,106,199,.13)}
button{border:0;border-radius:15px;font:800 15px Poppins,Arial,sans-serif;cursor:pointer}
.btn-main{width:100%;margin-top:16px;padding:15px;background:linear-gradient(135deg,#995ac2,#71369e);color:#fff;box-shadow:0 8px 20px rgba(113,54,158,.22)}
.btn-main:disabled{opacity:.6}
.err{background:#fff0f1;color:#9b3040;border:1px solid #f2ccd2;padding:12px 14px;border-radius:14px;margin-top:12px;font-weight:600;font-size:14px}
.ok{background:#ecfaf4;color:#176044;border:1px solid #ccefe0;padding:12px 14px;border-radius:14px;margin-top:12px;font-weight:600;font-size:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.search{margin-top:12px}
.prov{border:1px solid #eee1ef;border-radius:18px;padding:15px 16px;margin-top:12px;background:linear-gradient(180deg,#fff,#fdf9fe);cursor:pointer}
.prov-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.prov-name{font-weight:800;font-size:17px}
.prov-meta{font-size:13px;color:var(--muted);margin-top:2px}
.saldo{text-align:right}
.saldo-val{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:700}
.saldo-val.debe{color:#a13030}
.saldo-val.favor{color:#177a4d}
.saldo-label{font-size:11px;color:var(--muted);font-weight:700}
.detail{margin-top:14px;border-top:1px dashed #e6d9e8;padding-top:12px;display:none}
.detail.open{display:block}
.detail h4{margin:0 0 8px;font-size:13px;color:var(--purple);text-transform:uppercase;letter-spacing:.3px}
.mini-row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px dashed #f0e5f0}
.empty{padding:30px;text-align:center;color:#817287;background:#fbf7fc;border:1px dashed #dfd0e4;border-radius:16px;margin-top:14px}
.loading{text-align:center;padding:30px;color:var(--muted)}
.del-pago{background:none;border:0;color:#c0435a;font-size:12px;font-weight:700;padding:2px 6px}
.totales{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tot-stat{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:14px 15px;box-shadow:0 8px 22px rgba(84,36,119,.07)}
.tot-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.tot-value{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:700;color:var(--purple)}
</style>
</head>
<body>

<header>
 <h1>📒 Cuenta Corriente Proveedor</h1>
 <a class="navlink" href="admin.html">← Volver al panel de pedidos</a> &nbsp;·&nbsp; <a class="navlink" href="facturas.html">🧾 Facturas proveedor</a>
</header>

<main>

<div id="noSession" class="card" style="display:none;text-align:center">
 <p>Tenés que iniciar sesión primero en el panel de pedidos.</p>
 <a href="admin.html"><button class="btn-main">Ir a iniciar sesión</button></a>
</div>

<div id="content" style="display:none">

 <div class="totales" id="totales"></div>

 <div class="card">
  <h2 style="margin:0 0 10px;font-family:'Cormorant Garamond',serif;color:var(--purple);font-size:26px">Registrar un pago al proveedor</h2>
  <p style="margin:0;color:var(--muted);font-size:13px">Podés registrar un pago parcial, el total, o de más (queda a favor para la próxima factura).</p>
  <label>Proveedor
   <select id="pagoProveedor"><option value="">Seleccionar proveedor...</option></select>
  </label>
  <label>Monto<input id="pagoMonto" type="number" min="0" inputmode="decimal" placeholder="Ej. 100000"></label>
  <label>Fecha<input id="pagoFecha" type="date"></label>
  <label>Nota (opcional)<input id="pagoNota" placeholder="Ej. Pago parcial factura O 57496"></label>
  <button class="btn-main" id="guardarPagoBtn">Guardar pago</button>
  <div id="pagoMsg"></div>
 </div>

 <div class="card">
  <div class="topbar">
   <strong id="countLabel">0 proveedores</strong>
  </div>
  <input id="searchProv" class="search" placeholder="🔎 Buscar proveedor...">
 </div>

 <div id="provList"></div>

</div>

</main>

<script>
const SUPABASE_URL="https://stkfdzqwcnzievrmivaj.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0a2ZkenF3Y256aWV2cm1pdmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODM4MzIsImV4cCI6MjEwNDQ1OTgzMn0.rMlhM8TBZhtwroF3lOwRBB8LOyRplPgZQnsUWtjptsM";
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);
const normProv=p=>(p||"").trim().toLowerCase().replace(/\s+/g," ");

let session=JSON.parse(localStorage.getItem("admin_session")||"null");
let facturas=[];
let pagos=[];
let proveedores=[];
let openKey=null;

async function apiFetch(path,options={}){
 const r=await fetch(SUPABASE_URL+path,{
  ...options,
  headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json",...(options.headers||{})}
 });
 if(r.status===401){localStorage.removeItem("admin_session");location.href="admin.html";throw new Error("Sesión vencida")}
 return r;
}

function buildProveedores(){
 const map={};
 facturas.forEach(f=>{
  if(!f.proveedor)return;
  const key=normProv(f.proveedor);
  if(!map[key])map[key]={key,proveedor:f.proveedor,facturas:[],pagos:[],debe:0};
  map[key].facturas.push(f);
  map[key].debe+=(f.importe||0);
 });
 pagos.forEach(p=>{
  const key=normProv(p.proveedor);
  if(!map[key])map[key]={key,proveedor:p.proveedor,facturas:[],pagos:[],debe:0};
  map[key].pagos.push(p);
 });
 proveedores=Object.values(map).map(p=>{
  const haber=p.pagos.reduce((s,x)=>s+(x.monto||0),0);
  return {...p,haber,saldo:p.debe-haber};
 }).sort((a,b)=>b.saldo-a.saldo);
}

function renderTotales(){
 const totalDebe=proveedores.reduce((s,p)=>s+p.debe,0);
 const totalHaber=proveedores.reduce((s,p)=>s+p.haber,0);
 const totalSaldo=totalDebe-totalHaber;
 $("totales").innerHTML=`
  <div class="tot-stat"><div class="tot-label">Total facturado</div><div class="tot-value">${money(totalDebe)}</div></div>
  <div class="tot-stat"><div class="tot-label">Total pagado</div><div class="tot-value">${money(totalHaber)}</div></div>
  <div class="tot-stat"><div class="tot-label">Saldo pendiente</div><div class="tot-value">${money(totalSaldo)}</div></div>
 `;
}

function fillProveedorSelect(){
 const opts=proveedores.map(p=>`<option value="${p.proveedor.replace(/"/g,'&quot;')}">${p.proveedor}</option>`).join("");
 $("pagoProveedor").innerHTML='<option value="">Seleccionar proveedor...</option>'+opts;
}

function fmtFechaCorta(iso){
 if(!iso)return "-";
 const [y,m,d]=iso.split("-");
 return `${d}/${m}/${y.slice(2)}`;
}

function renderProveedores(){
 const term=($("searchProv").value||"").toLowerCase().trim();
 const visible=proveedores.filter(p=>!term||p.proveedor.toLowerCase().includes(term));

 $("countLabel").textContent=visible.length+" "+(visible.length===1?"proveedor":"proveedores");

 if(!visible.length){$("provList").innerHTML='<div class="empty">No hay proveedores para mostrar.</div>';return}

 $("provList").innerHTML=visible.map(p=>{
  const aFavor=p.saldo<0;
  const open=openKey===p.key;
  const facturasHtml=p.facturas.slice().sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).map(f=>
   `<div class="mini-row"><span>${fmtFechaCorta(f.fecha)} ${f.tipo_comprobante?"· "+f.tipo_comprobante:""}${f.descripcion?" · "+f.descripcion:""}</span><span>${money(f.importe)}</span></div>`
  ).join("")||'<div class="mini-row"><span>Sin facturas registradas</span></div>';
  const pagosHtml=p.pagos.slice().sort((a,b)=>new Date(b.fecha)-new Date(a.fecha)).map(x=>
   `<div class="mini-row"><span>${fmtFechaCorta(x.fecha)} ${x.nota?"· "+x.nota:""}</span><span>${money(x.monto)} <button class="del-pago" onclick="event.stopPropagation();borrarPago(${x.id})">✕</button></span></div>`
  ).join("")||'<div class="mini-row"><span>Sin pagos registrados</span></div>';

  return `<div class="prov" onclick="toggleProv('${p.key.replace(/'/g,"\\'")}')">
   <div class="prov-top">
    <div>
     <div class="prov-name">${p.proveedor}</div>
     <div class="prov-meta">${p.facturas.length} factura${p.facturas.length===1?"":"s"}</div>
    </div>
    <div class="saldo">
     <div class="saldo-label">${aFavor?"A favor tuyo":"Le debés"}</div>
     <div class="saldo-val ${aFavor?"favor":"debe"}">${money(Math.abs(p.saldo))}</div>
    </div>
   </div>
   <div class="detail ${open?"open":""}">
    <h4>Facturas</h4>
    ${facturasHtml}
    <h4 style="margin-top:12px">Pagos registrados</h4>
    ${pagosHtml}
   </div>
  </div>`;
 }).join("");
}

function toggleProv(key){openKey=openKey===key?null:key;renderProveedores()}

async function cargarTodo(){
 $("provList").innerHTML='<div class="loading">Cargando...</div>';
 try{
  const [rFacturas,rPagos]=await Promise.all([
   apiFetch("/rest/v1/facturas_proveedor?select=id,proveedor,tipo_comprobante,descripcion,importe,fecha&order=fecha.desc"),
   apiFetch("/rest/v1/pagos_proveedor?select=*&order=fecha.desc")
  ]);
  facturas=await rFacturas.json();
  pagos=await rPagos.json();
  buildProveedores();
  renderTotales();
  fillProveedorSelect();
  renderProveedores();
 }catch(e){
  $("provList").innerHTML='<div class="err">❌ '+(e.message||"Error al cargar datos")+'</div>';
 }
}

async function guardarPago(){
 const proveedor=$("pagoProveedor").value;
 const monto=parseFloat($("pagoMonto").value);
 const fecha=$("pagoFecha").value;
 const nota=$("pagoNota").value.trim();
 $("pagoMsg").innerHTML="";
 if(!proveedor)return $("pagoMsg").innerHTML='<div class="err">Elegí un proveedor.</div>';
 if(!monto||monto<=0)return $("pagoMsg").innerHTML='<div class="err">Ingresá un monto válido.</div>';
 if(!fecha)return $("pagoMsg").innerHTML='<div class="err">Elegí una fecha.</div>';

 $("guardarPagoBtn").disabled=true;$("guardarPagoBtn").textContent="Guardando...";
 try{
  await apiFetch("/rest/v1/pagos_proveedor",{
   method:"POST",
   headers:{"Prefer":"return=minimal"},
   body:JSON.stringify({proveedor,monto,fecha,nota:nota||null})
  });
  $("pagoMsg").innerHTML='<div class="ok">✅ Pago registrado.</div>';
  $("pagoMonto").value="";$("pagoNota").value="";
  await cargarTodo();
 }catch(e){
  $("pagoMsg").innerHTML='<div class="err">❌ '+(e.message||"No se pudo guardar")+'</div>';
 }
 $("guardarPagoBtn").disabled=false;$("guardarPagoBtn").textContent="Guardar pago";
}

async function borrarPago(id){
 if(!confirm("¿Borrar este pago?"))return;
 try{
  await apiFetch("/rest/v1/pagos_proveedor?id=eq."+id,{method:"DELETE",headers:{"Prefer":"return=minimal"}});
  await cargarTodo();
 }catch(e){
  alert("No se pudo borrar: "+(e.message||"error desconocido"));
 }
}

$("guardarPagoBtn").addEventListener("click",guardarPago);
$("searchProv").addEventListener("input",renderProveedores);
$("pagoFecha").value=new Date().toISOString().slice(0,10);

if(session){
 $("content").style.display="block";
 cargarTodo();
}else{
 $("noSession").style.display="block";
}
</script>
</body>
</html>
