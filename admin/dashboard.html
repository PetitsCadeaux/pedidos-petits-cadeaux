<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#35265f">
<title>Dashboard - Petits Cadeaux</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--purple:#542477;--lilac:#a66ac7;--ink:#392541;--muted:#76657d;--line:#eaddea}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Poppins,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#fff 0,transparent 30%),linear-gradient(180deg,#f8edf4,#fffafe 42%,#f8f0fa);min-height:100vh}
header{padding:16px;text-align:center;background:linear-gradient(180deg,#fff7fb,#f8eaf4);color:var(--purple);border-bottom:1px solid #ead9e8;box-shadow:0 7px 24px rgba(84,36,119,.08)}
header h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(22px,6vw,32px);font-weight:700}
.navlink{display:inline-block;margin-top:8px;color:#865a8e;font-size:13px;font-weight:700;text-decoration:none}
main{max-width:900px;margin:auto;padding:18px 14px 42px}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:0 10px 30px rgba(84,36,119,.08)}
label{display:block;margin-top:11px;color:#5f4d68;font-size:14px;font-weight:800}
input{width:100%;padding:14px 15px;margin-top:7px;border:1px solid #ddcfe1;border-radius:16px;background:#fff;color:var(--ink);font:500 16px Poppins,Arial,sans-serif;outline:none}
input:focus{border-color:var(--lilac);box-shadow:0 0 0 4px rgba(166,106,199,.13)}
button{border:0;border-radius:15px;font:800 15px Poppins,Arial,sans-serif;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-main{padding:14px 18px;background:linear-gradient(135deg,#995ac2,#71369e);color:#fff;box-shadow:0 8px 20px rgba(113,54,158,.22);width:100%;margin-top:16px}
.err{background:#fff0f1;color:#9b3040;border:1px solid #f2ccd2;padding:12px 14px;border-radius:14px;margin-top:12px;font-weight:600;font-size:14px}
.section-title{margin:0 0 10px;font-family:"Cormorant Garamond",Georgia,serif;color:var(--purple);font-size:24px;display:flex;align-items:center;gap:8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:#fbf7fc;border:1px solid var(--line);border-radius:16px;padding:14px 15px}
.stat.wide{grid-column:1/-1}
.stat-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase}
.stat-value{font-family:"Cormorant Garamond",Georgia,serif;font-size:26px;font-weight:700;color:var(--purple);margin-top:2px}
.stat-value.pos{color:#177a4d}
.stat-value.neg{color:#a13030}
.bar-wrap{margin-top:10px;background:#eee1ef;border-radius:999px;height:10px;overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#6d3a97,#9c61c5)}
.loading{text-align:center;padding:30px;color:var(--muted)}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>

<header>
 <h1>📊 Dashboard</h1>
 <a class="navlink" href="admin.html">← Volver al panel de pedidos</a>
</header>

<main>

<div id="noSession" class="card" style="display:none;text-align:center">
 <p>Tenés que iniciar sesión primero en el panel de pedidos.</p>
 <a href="admin.html"><button class="btn-main">Ir a iniciar sesión</button></a>
</div>

<div id="content" style="display:none">

 <div class="card">
  <div class="row2">
   <label>Desde<input type="date" id="fDesde"></label>
   <label>Hasta<input type="date" id="fHasta"></label>
  </div>
  <button class="btn-main" id="aplicarBtn">Aplicar filtro</button>
  <div id="msg"></div>
 </div>

 <div class="card">
  <div class="section-title">💰 Utilidad del período</div>
  <div class="stats" id="utilidadStats"><div class="loading">Cargando...</div></div>
 </div>

 <div class="card">
  <div class="section-title">🏦 Flujo de caja del período</div>
  <div class="stats" id="flujoStats"></div>
 </div>

 <div class="card">
  <div class="section-title">📒 Saldos pendientes (a hoy)</div>
  <div class="stats" id="saldosStats"></div>
 </div>

</div>

</main>

<script>
const SUPABASE_URL="https://stkfdzqwcnzievrmivaj.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0a2ZkenF3Y256aWV2cm1pdmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODM4MzIsImV4cCI6MjEwNDQ1OTgzMn0.rMlhM8TBZhtwroF3lOwRBB8LOyRplPgZQnsUWtjptsM";
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);

const session=JSON.parse(localStorage.getItem("admin_session")||"null");

async function apiFetch(path,options={}){
 const r=await fetch(SUPABASE_URL+path,{
  ...options,
  headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json",...(options.headers||{})}
 });
 if(r.status===401){localStorage.removeItem("admin_session");location.href="admin.html";throw new Error("Sesión vencida")}
 const data=await r.json();
 if(!r.ok)throw new Error(data.message||JSON.stringify(data));
 return data;
}

function enRango(fecha,desde,hasta){
 if(!fecha)return false;
 const f=fecha.slice(0,10);
 if(desde&&f<desde)return false;
 if(hasta&&f>hasta)return false;
 return true;
}

async function cargar(){
 const desde=$("fDesde").value;
 const hasta=$("fHasta").value;
 $("msg").innerHTML="";

 try{
  const [pedidos,costos,pagosClientes,saldosIniciales,facturasProv,pagosProv]=await Promise.all([
   apiFetch("/rest/v1/pedidos_distribuidora?select=total,productos,created_at"),
   apiFetch("/rest/v1/costos_productos?select=*"),
   apiFetch("/rest/v1/pagos_clientes?select=monto,fecha"),
   apiFetch("/rest/v1/saldos_iniciales?select=monto"),
   apiFetch("/rest/v1/facturas_proveedor?select=importe"),
   apiFetch("/rest/v1/pagos_proveedor?select=monto,fecha"),
  ]);

  // ---- Utilidad del período (por fecha de pedido) ----
  const pedidosPeriodo=pedidos.filter(o=>enRango(o.created_at,desde,hasta));
  const costoDe=p=>{const c=costos.find(x=>x.producto===p);return c?c.costo:null};
  let venta=0,costo=0,faltanCostos=false;
  pedidosPeriodo.forEach(o=>{
   if(o.total!=null)venta+=o.total;
   (o.productos||[]).forEach(it=>{
    const c=costoDe(it.producto);
    if(c==null)faltanCostos=true;
    else costo+=c*it.cantidad;
   });
  });
  const margen=venta-costo;
  const margenPct=venta>0?(margen/venta*100):0;

  $("utilidadStats").innerHTML=`
   <div class="stat"><div class="stat-label">Ventas</div><div class="stat-value">${money(venta)}</div></div>
   <div class="stat"><div class="stat-label">Costo mercadería</div><div class="stat-value">${money(costo)}${faltanCostos?" *":""}</div></div>
   <div class="stat"><div class="stat-label">Margen bruto</div><div class="stat-value ${margen>=0?"pos":"neg"}">${money(margen)}</div></div>
   <div class="stat"><div class="stat-label">% Margen</div><div class="stat-value ${margen>=0?"pos":"neg"}">${margenPct.toFixed(1)}%</div></div>
   ${faltanCostos?'<div class="stat wide" style="font-size:12px;color:var(--muted)">* Hay productos sin costo cargado — el margen real puede variar. Cargalos en "Costos y márgenes".</div>':""}
  `;

  // ---- Flujo de caja del período (pagos reales) ----
  const cobros=pagosClientes.filter(p=>enRango(p.fecha,desde,hasta)).reduce((s,p)=>s+(p.monto||0),0);
  const pagos=pagosProv.filter(p=>enRango(p.fecha,desde,hasta)).reduce((s,p)=>s+(p.monto||0),0);
  const flujoNeto=cobros-pagos;
  const maxFlujo=Math.max(cobros,pagos,1);

  $("flujoStats").innerHTML=`
   <div class="stat"><div class="stat-label">Cobros a clientes</div><div class="stat-value pos">${money(cobros)}</div><div class="bar-wrap"><div class="bar-fill" style="width:${cobros/maxFlujo*100}%;background:linear-gradient(90deg,#2e8b57,#4fbf82)"></div></div></div>
   <div class="stat"><div class="stat-label">Pagos a proveedor</div><div class="stat-value neg">${money(pagos)}</div><div class="bar-wrap"><div class="bar-fill" style="width:${pagos/maxFlujo*100}%;background:linear-gradient(90deg,#a13030,#d96b6b)"></div></div></div>
   <div class="stat wide"><div class="stat-label">Flujo neto de caja</div><div class="stat-value ${flujoNeto>=0?"pos":"neg"}">${money(flujoNeto)}</div></div>
  `;

  // ---- Saldos pendientes (snapshot a hoy, no depende del filtro) ----
  const totalVentasHist=pedidos.reduce((s,o)=>s+(o.total||0),0);
  const totalCobrosHist=pagosClientes.reduce((s,p)=>s+(p.monto||0),0);
  const totalSaldosIniciales=saldosIniciales.reduce((s,x)=>s+(x.monto||0),0);
  const porCobrar=totalVentasHist+totalSaldosIniciales-totalCobrosHist;

  const totalFacturasProv=facturasProv.reduce((s,f)=>s+(f.importe||0),0);
  const totalPagosProvHist=pagosProv.reduce((s,p)=>s+(p.monto||0),0);
  const porPagar=totalFacturasProv-totalPagosProvHist;

  $("saldosStats").innerHTML=`
   <div class="stat wide"><div class="stat-label">Total a cobrar de clientes</div><div class="stat-value neg">${money(Math.max(0,porCobrar))}</div></div>
   <div class="stat wide"><div class="stat-label">Total a pagar al proveedor</div><div class="stat-value neg">${money(Math.max(0,porPagar))}</div></div>
  `;

 }catch(e){
  $("msg").innerHTML='<div class="err">❌ '+(e.message||"Error al cargar el dashboard")+'</div>';
 }
}

$("aplicarBtn").addEventListener("click",cargar);

if(session){
 $("content").style.display="block";
 cargar();
}else{
 $("noSession").style.display="block";
}
</script>
</body>
</html>
