<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#35265f">
<title>Panel Admin - Petits Cadeaux</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--purple:#542477;--lilac:#a66ac7;--ink:#392541;--muted:#76657d;--line:#eaddea}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Poppins,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#fff 0,transparent 30%),linear-gradient(180deg,#f8edf4,#fffafe 42%,#f8f0fa);min-height:100vh}
header{padding:16px;text-align:center;background:linear-gradient(180deg,#fff7fb,#f8eaf4);color:var(--purple);border-bottom:1px solid #ead9e8;box-shadow:0 7px 24px rgba(84,36,119,.08)}
header h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(24px,6vw,34px);font-weight:700}
main{max-width:820px;margin:auto;padding:18px 14px 42px}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:0 10px 30px rgba(84,36,119,.08)}
label{display:block;margin-top:11px;color:#5f4d68;font-size:14px;font-weight:800}
input,select{width:100%;padding:14px 15px;margin-top:7px;border:1px solid #ddcfe1;border-radius:16px;background:#fff;color:var(--ink);font:500 16px Poppins,Arial,sans-serif;outline:none}
input:focus,select:focus{border-color:var(--lilac);box-shadow:0 0 0 4px rgba(166,106,199,.13)}
button{border:0;border-radius:15px;font:800 15px Poppins,Arial,sans-serif;cursor:pointer}
.btn-main{width:100%;margin-top:16px;padding:15px;background:linear-gradient(135deg,#995ac2,#71369e);color:#fff;box-shadow:0 8px 20px rgba(113,54,158,.22)}
.btn-main:disabled{opacity:.6}
.err{background:#fff0f1;color:#9b3040;border:1px solid #f2ccd2;padding:12px 14px;border-radius:14px;margin-top:12px;font-weight:600;font-size:14px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.logout{padding:9px 15px;background:#fff;border:1px solid #ddcde4;color:#654273}
.filters{display:flex;gap:8px;overflow-x:auto;padding:2px 1px 4px;margin:14px 0 0}
.chip{padding:9px 15px;border:1px solid #ddcde4;border-radius:13px;background:#fff;color:#654273;font:700 12px Poppins,Arial,sans-serif;white-space:nowrap}
.chip.active{background:linear-gradient(135deg,#6d3a97,#9c61c5);color:#fff;border-color:#6d3a97}
.search{margin-top:12px}
.order{border:1px solid #eee1ef;border-radius:18px;padding:15px 16px;margin-top:12px;background:linear-gradient(180deg,#fff,#fdf9fe)}
.order.tomado{opacity:.68}
.order-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.order-shop{font-weight:800;font-size:17px}
.order-meta{font-size:13px;color:var(--muted);margin-top:2px;line-height:1.5}
.badge{padding:5px 11px;border-radius:999px;font-size:11px;font-weight:800;white-space:nowrap}
.badge.pendiente{background:#fff1de;color:#a15b00}
.badge.tomado{background:#e6f7ee;color:#177a4d}
.badge.entregado{background:#ede6fb;color:#5a2f8a}
.badge.efectivo{background:#e6f7ee;color:#177a4d}
.badge.transferencia{background:#e8f0fe;color:#1a56b0}
.badge.demorado{background:#fde8e8;color:#a13030}
.badges-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pay-select{margin-top:0;padding:10px 12px;font-size:13px;width:auto;min-width:150px}
.items{margin-top:10px;font-size:14px;color:var(--ink);border-top:1px dashed #e6d9e8;padding-top:10px}
.items div{padding:2px 0}
.order-total{margin-top:8px;font-weight:800;color:var(--purple)}
.order-notes{margin-top:8px;font-size:13px;color:var(--muted);font-style:italic}
.actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.actions button{padding:11px 14px;font-size:13px}
.btn-take{background:linear-gradient(135deg,#542477,#7d45a9);color:#fff;flex:1}
.btn-wa{background:#e9f8f0;color:#177a4d;border:1px solid #cdecdb!important;border:1px solid;}
.btn-del{background:#fff0f1;color:#9b3040;border:1px solid #f2ccd2!important;border:1px solid;}
.empty{padding:30px;text-align:center;color:#817287;background:#fbf7fc;border:1px dashed #dfd0e4;border-radius:16px;margin-top:14px}
.loading{text-align:center;padding:30px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:15px 16px;box-shadow:0 8px 22px rgba(84,36,119,.07)}
.stat-label{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.stat-value{font-family:"Cormorant Garamond",Georgia,serif;font-size:30px;font-weight:700;color:var(--purple);margin-top:2px;line-height:1.1}
.stat.wide{grid-column:1/-1}
.stat-value.small{font-size:19px}
.dias-row{display:flex;gap:18px;margin-top:6px}
.dias-row div{flex:1}
.dias-row span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.dias-row strong{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;color:var(--purple)}
@media(min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}.stat.wide{grid-column:span 2}}
</style>
</head>
<body>

<header><h1>📋 Panel de Pedidos</h1><div><a href="cuenta.html" style="display:inline-block;margin-top:8px;color:#865a8e;font-size:13px;font-weight:700;text-decoration:none">📒 Cuenta corriente</a> &nbsp;·&nbsp; <a href="facturas.html" style="display:inline-block;margin-top:8px;color:#865a8e;font-size:13px;font-weight:700;text-decoration:none">🧾 Facturas proveedor</a> &nbsp;·&nbsp; <a href="reporte.html" style="display:inline-block;margin-top:8px;color:#865a8e;font-size:13px;font-weight:700;text-decoration:none">📦 Reporte para distribuidor</a></div></header>

<main>

<div id="loginView" class="card" style="max-width:420px;margin:40px auto 0">
  <h2 style="margin:0 0 10px;font-family:'Cormorant Garamond',serif;color:var(--purple);font-size:28px">Iniciar sesión</h2>
  <label>Email<input id="email" type="email" autocomplete="username"></label>
  <label>Contraseña<input id="password" type="password" autocomplete="current-password"></label>
  <button class="btn-main" id="loginBtn">Ingresar</button>
  <div id="loginError"></div>
</div>

<div id="panelView" style="display:none">
  <div class="stats" id="stats"></div>
  <div class="card">
    <div class="topbar">
      <div><strong id="countLabel">0 pedidos</strong></div>
      <div style="display:flex;gap:8px">
       <button class="logout" id="printSelectedBtn">🖨️ Imprimir seleccionados</button>
       <button class="logout" id="logoutBtn">Cerrar sesión</button>
      </div>
    </div>
    <input id="searchOrders" class="search" placeholder="🔎 Buscar por comercio...">
    <div class="filters" id="statusFilters">
      <button type="button" class="chip active" data-f="Todos">Todos</button>
      <button type="button" class="chip" data-f="Pendiente">Pendientes</button>
      <button type="button" class="chip" data-f="Tomado">Tomados</button>
      <button type="button" class="chip" data-f="Entregado">Entregados</button>
    </div>
  </div>
  <div id="ordersList"></div>
</div>

</main>

<script>
const SUPABASE_URL="https://stkfdzqwcnzievrmivaj.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0a2ZkenF3Y256aWV2cm1pdmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODM4MzIsImV4cCI6MjEwNDQ1OTgzMn0.rMlhM8TBZhtwroF3lOwRBB8LOyRplPgZQnsUWtjptsM";
const $=id=>document.getElementById(id);
const money=n=>n==null?"A confirmar":new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n);

let session=JSON.parse(localStorage.getItem("admin_session")||"null");
let orders=[];
let statusFilter="Todos";

function showPanel(){$("loginView").style.display="none";$("panelView").style.display="block";cargarPedidos()}
function showLogin(){$("loginView").style.display="block";$("panelView").style.display="none"}

async function login(){
 const email=$("email").value.trim(),password=$("password").value;
 $("loginError").innerHTML="";
 if(!email||!password){$("loginError").innerHTML='<div class="err">Completá email y contraseña.</div>';return}
 $("loginBtn").disabled=true;$("loginBtn").textContent="Ingresando...";
 try{
  const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
   method:"POST",
   headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
   body:JSON.stringify({email,password})
  });
  const data=await r.json();
  if(!r.ok)throw new Error(data.error_description||data.msg||"Credenciales incorrectas");
  session={access_token:data.access_token,refresh_token:data.refresh_token,email};
  localStorage.setItem("admin_session",JSON.stringify(session));
  showPanel();
 }catch(e){
  $("loginError").innerHTML='<div class="err">❌ '+(e.message||"No se pudo iniciar sesión")+'</div>';
 }
 $("loginBtn").disabled=false;$("loginBtn").textContent="Ingresar";
}

function logout(){
 localStorage.removeItem("admin_session");
 session=null;
 showLogin();
}

async function apiFetch(path,options={}){
 const r=await fetch(SUPABASE_URL+path,{
  ...options,
  headers:{
   "apikey":SUPABASE_KEY,
   "Authorization":"Bearer "+session.access_token,
   "Content-Type":"application/json",
   ...(options.headers||{})
  }
 });
 if(r.status===401){logout();throw new Error("Sesión vencida, ingresá de nuevo.")}
 return r;
}

async function cargarPedidos(){
 $("ordersList").innerHTML='<div class="loading">Cargando pedidos...</div>';
 try{
  const r=await apiFetch("/rest/v1/pedidos_distribuidora?select=*&order=created_at.desc");
  orders=await r.json();
  render();
 }catch(e){
  $("ordersList").innerHTML='<div class="err">❌ '+(e.message||"Error al cargar pedidos")+'</div>';
 }
}

async function cambiarEstadoPedido(id,select){
 const valor=select.value;
 select.disabled=true;
 const ahora=new Date().toISOString();
 let body;
 if(valor==="Pendiente")body={estado:"Pendiente",estado_entrega:"Pendiente",fecha_entrega:null};
 else if(valor==="Tomado")body={estado:"Tomado",estado_entrega:"Pendiente",fecha_entrega:null};
 else body={estado:"Tomado",estado_entrega:"Entregado",fecha_entrega:ahora};
 try{
  await apiFetch("/rest/v1/pedidos_distribuidora?id=eq."+id,{
   method:"PATCH",
   headers:{"Prefer":"return=minimal"},
   body:JSON.stringify(body)
  });
  const o=orders.find(x=>x.id===id);
  if(o)Object.assign(o,body);
  render();
 }catch(e){
  alert("No se pudo actualizar: "+(e.message||"error desconocido"));
  select.disabled=false;
 }
}

async function borrarPedido(id,btn){
 if(!confirm("¿Seguro que querés borrar este pedido? Esta acción no se puede deshacer."))return;
 btn.disabled=true;btn.textContent="Borrando...";
 try{
  await apiFetch("/rest/v1/pedidos_distribuidora?id=eq."+id,{
   method:"DELETE",
   headers:{"Prefer":"return=minimal"}
  });
  orders=orders.filter(x=>x.id!==id);
  render();
 }catch(e){
  alert("No se pudo borrar: "+(e.message||"error desconocido"));
  btn.disabled=false;btn.textContent="Borrar";
 }
}

async function cambiarPago(id,select){
 const valor=select.value;
 select.disabled=true;
 try{
  const ahora=valor==="Pendiente"?null:new Date().toISOString();
  await apiFetch("/rest/v1/pedidos_distribuidora?id=eq."+id,{
   method:"PATCH",
   headers:{"Prefer":"return=minimal"},
   body:JSON.stringify({estado_pago:valor,fecha_pago:ahora})
  });
  const o=orders.find(x=>x.id===id);
  if(o){o.estado_pago=valor;o.fecha_pago=ahora}
  render();
 }catch(e){
  alert("No se pudo actualizar el pago: "+(e.message||"error desconocido"));
  select.disabled=false;
 }
}

function fmtFecha(iso){
 const d=new Date(iso);
 return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
}

function renderStats(){
 const total=orders.length;
 const pendientes=orders.filter(o=>o.estado!=="Tomado");
 const tomados=orders.filter(o=>o.estado==="Tomado");
 const montoPendiente=pendientes.reduce((s,o)=>s+(o.total||0),0);
 const hayAConfirmar=pendientes.some(o=>o.total==null);
 const porMiercoles=orders.filter(o=>o.dia_entrega==="Miércoles").length;
 const porViernes=orders.filter(o=>o.dia_entrega==="Viernes").length;

 const entregados=orders.filter(o=>o.estado_entrega==="Entregado").length;
 const sinEntregar=total-entregados;

 const porPago={Pendiente:0,Efectivo:0,Transferencia:0,Demorado:0};
 orders.forEach(o=>{const e=o.estado_pago||"Pendiente";if(porPago[e]==null)porPago[e]=0;porPago[e]++});
 const cobrado=orders.filter(o=>o.estado_pago==="Efectivo"||o.estado_pago==="Transferencia").reduce((s,o)=>s+(o.total||0),0);

 $("stats").innerHTML=`
  <div class="stat"><div class="stat-label">Total pedidos</div><div class="stat-value">${total}</div></div>
  <div class="stat"><div class="stat-label">Pendientes</div><div class="stat-value">${pendientes.length}</div></div>
  <div class="stat"><div class="stat-label">Tomados</div><div class="stat-value">${tomados.length}</div></div>
  <div class="stat"><div class="stat-label">$ por cobrar (pendientes)</div><div class="stat-value small">${money(montoPendiente)}${hayAConfirmar?" +":""}</div></div>
  <div class="stat"><div class="stat-label">Entregados</div><div class="stat-value">${entregados}</div></div>
  <div class="stat"><div class="stat-label">Sin entregar</div><div class="stat-value">${sinEntregar}</div></div>
  <div class="stat"><div class="stat-label">$ cobrado</div><div class="stat-value small">${money(cobrado)}</div></div>
  <div class="stat wide">
   <div class="stat-label">Pedidos por día de entrega</div>
   <div class="dias-row">
    <div><span>Miércoles</span><strong>${porMiercoles}</strong></div>
    <div><span>Viernes</span><strong>${porViernes}</strong></div>
   </div>
  </div>
  <div class="stat wide">
   <div class="stat-label">Estado de pago</div>
   <div class="dias-row">
    <div><span>Pendiente</span><strong>${porPago.Pendiente||0}</strong></div>
    <div><span>Efectivo</span><strong>${porPago.Efectivo||0}</strong></div>
    <div><span>Transferencia</span><strong>${porPago.Transferencia||0}</strong></div>
    <div><span>Demorado</span><strong>${porPago.Demorado||0}</strong></div>
   </div>
  </div>
 `;
}

function render(){
 renderStats();
 const term=($("searchOrders").value||"").toLowerCase().trim();
 const visible=orders
  .filter(o=>{
   if(statusFilter==="Todos")return true;
   const est=o.estado_entrega==="Entregado"?"Entregado":(o.estado==="Tomado"?"Tomado":"Pendiente");
   return est===statusFilter;
  })
  .filter(o=>!term||(o.comercio||"").toLowerCase().includes(term));

 $("countLabel").textContent=visible.length+" "+(visible.length===1?"pedido":"pedidos");

 if(!visible.length){$("ordersList").innerHTML='<div class="empty">No hay pedidos para mostrar.</div>';return}

 $("ordersList").innerHTML=visible.map(o=>{
  const items=(o.productos||[]).map(it=>`<div>• ${it.cantidad} × ${it.producto}${it.precio_unitario!=null?" — "+money(it.cantidad*it.precio_unitario):" — a confirmar"}</div>`).join("");
  const tomado=o.estado==="Tomado";
  const entregado=o.estado_entrega==="Entregado";
  const estadoPedido=entregado?"Entregado":(tomado?"Tomado":"Pendiente");
  const estadoClase=entregado?"entregado":(tomado?"tomado":"pendiente");
  const pago=o.estado_pago||"Pendiente";
  const pagoClase=pago==="Efectivo"?"efectivo":pago==="Transferencia"?"transferencia":pago==="Demorado"?"demorado":"pendiente";
  const waNum=(o.whatsapp||"").replace(/\D/g,"");
  return `<div class="order ${tomado?"tomado":""}">
   <div class="order-top">
    <div style="display:flex;gap:10px;align-items:flex-start">
     <input type="checkbox" class="order-check" data-id="${o.id}" style="margin-top:4px;width:18px;height:18px">
     <div>
      <div class="order-shop">${o.comercio||"Sin nombre"}</div>
      <div class="order-meta">📅 ${o.dia_entrega||"-"} · 🕒 ${fmtFecha(o.created_at)}${o.domicilio?" · 📍 "+o.domicilio:""}${o.whatsapp?" · 📞 "+o.whatsapp:""}</div>
     </div>
    </div>
    <span class="badge ${estadoClase}">${estadoPedido}</span>
   </div>
   <div class="items">${items||"<div>Sin productos</div>"}</div>
   <div class="order-total">Total: ${money(o.total)}</div>
   ${o.observaciones?`<div class="order-notes">📝 ${o.observaciones}</div>`:""}
   <div class="actions">
    <select class="pay-select" onchange="cambiarEstadoPedido(${o.id},this)">
     <option value="Pendiente" ${estadoPedido==="Pendiente"?"selected":""}>Estado: Pendiente</option>
     <option value="Tomado" ${estadoPedido==="Tomado"?"selected":""}>Estado: Tomado</option>
     <option value="Entregado" ${estadoPedido==="Entregado"?"selected":""}>Estado: Entregado</option>
    </select>
    <select class="pay-select" onchange="cambiarPago(${o.id},this)">
     <option value="Pendiente" ${pago==="Pendiente"?"selected":""}>Pago: Pendiente</option>
     <option value="Efectivo" ${pago==="Efectivo"?"selected":""}>Pago: Efectivo</option>
     <option value="Transferencia" ${pago==="Transferencia"?"selected":""}>Pago: Transferencia</option>
     <option value="Demorado" ${pago==="Demorado"?"selected":""}>Pago: Demorado</option>
    </select>
    ${waNum?`<button class="btn-wa" onclick="window.open('https://wa.me/${waNum}','_blank')">💬 WhatsApp</button>`:""}
    <button class="btn-wa" onclick="window.open('comprobante.html?ids=${o.id}','_blank')">🖨️ Imprimir</button>
    <button class="btn-del" onclick="borrarPedido(${o.id},this)">🗑️ Borrar</button>
   </div>
  </div>`;
 }).join("");
}

document.querySelectorAll("#statusFilters .chip").forEach(btn=>{
 btn.addEventListener("click",()=>{
  statusFilter=btn.dataset.f;
  document.querySelectorAll("#statusFilters .chip").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
 });
});

$("loginBtn").addEventListener("click",login);
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("logoutBtn").addEventListener("click",logout);
$("searchOrders").addEventListener("input",render);
$("printSelectedBtn").addEventListener("click",()=>{
 const ids=[...document.querySelectorAll(".order-check:checked")].map(c=>c.dataset.id);
 if(!ids.length){alert("Tildá al menos un pedido para imprimir.");return}
 window.open("comprobante.html?ids="+ids.join(","),"_blank");
});

if(session){showPanel()}else{showLogin()}
</script>
</body>
</html>
