<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tienda · Distribuidora Petits Cadeaux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#542477;--lilac:#a66ac7;--ink:#392541;--muted:#76657d;--line:#eaddea;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Poppins',Arial,sans-serif;background:#faf6fb;color:var(--ink);}
  header{background:linear-gradient(135deg,var(--purple),#7d45a9);padding:22px 16px;text-align:center;color:#fff;}
  header h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:26px;margin:0;}
  header p{margin:6px 0 0;font-size:13px;color:#e9d9ee;}

  main{max-width:1180px;margin:0 auto;padding:18px 14px 120px;}

  .filters{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px;}
  .filters button{
    flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:999px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .filters button.active{background:var(--purple);color:#fff;border-color:var(--purple);}

  /* Grilla de productos: apaisada en pantallas anchas (web), se achica sola
     en mobile. Cada tarjeta es compacta — el detalle con los packs y
     precios se abre al hacer clic, en vez de mostrarse todo de entrada. */
  #catalog{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
  @media(min-width:900px){#catalog{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;}}

  .product-card{
    background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;
    box-shadow:0 4px 14px rgba(84,36,119,.06);display:flex;flex-direction:column;
    transition:transform .12s,box-shadow .12s;
  }
  .product-card:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(84,36,119,.12);}
  .product-card .ph-photo{width:100%;aspect-ratio:1/1;background:#f3e8f5;position:relative;}
  .product-card .ph-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .product-card .ph-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;color:#b79fbd;text-align:center;}
  .product-card .in-cart-tag{position:absolute;top:8px;right:8px;background:var(--purple);color:#fff;font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .product-card .pc-body{padding:11px 12px 13px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .product-card .name{font-weight:700;font-size:14px;line-height:1.25;}
  .product-card .from-price{font-size:12px;color:var(--muted);}
  .product-card .from-price strong{color:var(--purple);font-size:15px;font-weight:800;}
  .product-card .pc-btn{
    margin-top:6px;border:1px solid var(--purple);color:var(--purple);background:#fff;
    border-radius:10px;padding:8px;font-size:12.5px;font-weight:700;text-align:center;
  }
  .product-card.in-cart .pc-btn{background:var(--purple);color:#fff;}

  .product-modal .modal{max-width:460px;}
  .product-modal .pm-photo{width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#f3e8f5;margin-bottom:14px;}
  .product-modal .pm-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .product-modal .pm-photo .ph-noimg{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#b79fbd;}
  .product-modal h2{margin-bottom:4px;}

  .tiers{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .tier{
    position:relative;border:2px solid var(--line);border-radius:13px;padding:11px 14px;
    display:flex;align-items:center;justify-content:space-between;cursor:pointer;
  }
  .tier.selected{border-color:var(--purple);background:#f8f1fb;}
  .tier input{position:absolute;opacity:0;pointer-events:none;}
  .tier-left{display:flex;align-items:center;gap:10px;}
  .radio{width:18px;height:18px;border-radius:50%;border:2px solid #cbb7d2;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .tier.selected .radio{border-color:var(--purple);}
  .radio::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--purple);opacity:0;transition:opacity .15s;}
  .tier.selected .radio::after{opacity:1;}
  .tier-qty{font-weight:700;font-size:13.5px;}
  .save-tag{display:inline-block;margin-top:2px;font-size:10.5px;font-weight:700;color:#1a7a3d;background:#e6f6ea;padding:1px 7px;border-radius:6px;}
  .tier-right{text-align:right;}
  .tier-price{font-weight:800;font-size:14.5px;}
  .tier-old{color:#b79fbd;font-size:11.5px;text-decoration:line-through;margin-right:5px;}
  .badge{
    position:absolute;top:-9px;right:12px;background:var(--purple);color:#fff;
    font-size:9.5px;font-weight:700;padding:2px 9px;border-radius:999px;
  }

  .no-precio{color:var(--muted);font-size:13px;padding:6px 0;}

  #cartBar{
    position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    box-shadow:0 -6px 18px rgba(84,36,119,.10);padding:12px 16px;display:none;
    align-items:center;justify-content:space-between;gap:12px;z-index:50;
  }
  #cartBar .info{font-size:13px;color:var(--muted);}
  #cartBar .total{font-weight:800;font-size:17px;color:var(--purple);}
  #cartBar button{
    background:linear-gradient(135deg,var(--purple),#7d45a9);color:#fff;border:none;
    border-radius:12px;padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;
  }

  .modal-bg{display:none;position:fixed;inset:0;background:rgba(57,37,65,.45);z-index:100;align-items:flex-end;justify-content:center;}
  .modal-bg.open{display:flex;}
  .modal{background:#fff;border-radius:20px 20px 0 0;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 20px 26px;}
  .modal h2{font-family:'Cormorant Garamond',Georgia,serif;color:var(--purple);margin:0 0 14px;font-size:22px;}
  .modal label{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin:12px 0 5px;}
  .modal input,.modal textarea,.modal select{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;
  }
  .modal textarea{resize:vertical;min-height:60px;}
  .cart-items{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);margin:14px 0;padding:10px 0;}
  .cart-item{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;}
  .cart-total{display:flex;justify-content:space-between;font-weight:800;font-size:17px;color:var(--purple);margin-top:8px;}
  .modal .send-btn{
    width:100%;margin-top:16px;background:linear-gradient(135deg,var(--purple),#7d45a9);
    color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;
  }
  .modal .send-btn:disabled{background:#e4d7e8;color:#a894ae;cursor:not-allowed;}
  .modal .close-btn{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;float:right;}
  #modalMsg{margin-top:12px;font-size:13px;padding:10px 12px;border-radius:10px;display:none;}
  #modalMsg.ok{display:block;background:#e6f6ea;color:#1a7a3d;}
  #modalMsg.err{display:block;background:#fbe7ea;color:#a3273f;}
</style>
</head>
<body>

<header>
  <h1>Distribuidora Petits Cadeaux</h1>
  <p>Venta al público · packs con descuento por cantidad</p>
</header>

<main>
  <div class="filters" id="filters"></div>
  <div id="catalog"></div>
</main>

<div id="cartBar">
  <div class="info">
    <div id="cartCount">0 productos</div>
    <div class="total" id="cartTotal">$0</div>
  </div>
  <button id="openCheckout">Ver pedido</button>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <button class="close-btn" id="closeModal">Cerrar ✕</button>
    <h2>Tu pedido</h2>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-total"><span>Total</span><span id="modalTotal">$0</span></div>

    <label>Nombre</label>
    <input type="text" id="fNombre" placeholder="Tu nombre">
    <label>WhatsApp</label>
    <input type="tel" id="fWhatsapp" placeholder="11 1234-5678">
    <label>Email <span id="lblEmailOpc" style="font-weight:400">(para el comprobante de pago)</span></label>
    <input type="email" id="fEmail" placeholder="tuemail@ejemplo.com">
    <label>Calle</label>
    <input type="text" id="fCalle" placeholder="Ej. Av. Mitre">
    <label>Altura</label>
    <input type="text" id="fAltura" placeholder="Ej. 1234">
    <label>Piso / depto <span style="font-weight:400">(si corresponde)</span></label>
    <input type="text" id="fPisoDepto" placeholder="Ej. 2° A">
    <label>Localidad</label>
    <input type="text" id="fLocalidad" placeholder="Ej. Berazategui">
    <label>Provincia</label>
    <input type="text" id="fProvincia" placeholder="Ej. Buenos Aires">
    <label>Código postal</label>
    <input type="text" id="fCP" placeholder="Ej. 1884">

    <button type="button" class="send-btn" id="cotizarEnvioBtn" style="background:#6b4b7a;margin:8px 0">📦 Calcular costo de envío</button>
    <div id="envioOpciones"></div>

    <label>Forma de pago</label>
    <select id="fPago">
      <option value="Efectivo">Efectivo</option>
      <option value="Transferencia">Transferencia</option>
      <option value="Mercado Pago">Mercado Pago</option>
    </select>
    <label>Observaciones</label>
    <textarea id="fObs" placeholder="Horario, indicaciones, etc."></textarea>

    <button class="send-btn" id="sendOrder">Enviar pedido por WhatsApp</button>
    <a class="send-btn" id="payLink" href="#" target="_blank" rel="noopener" style="display:none;text-align:center;text-decoration:none">Tocá para pagar con Mercado Pago</a>
    <div id="modalMsg"></div>
  </div>
</div>

<div class="modal-bg product-modal" id="productModalBg">
  <div class="modal">
    <button class="close-btn" id="closeProductModal">Cerrar ✕</button>
    <div class="pm-photo" id="pmPhoto"></div>
    <h2 id="pmName"></h2>
    <div class="tiers" id="pmTiers"></div>
    <button type="button" class="send-btn" id="pmAddBtn" disabled>Elegí un pack arriba</button>
  </div>
</div>

<script>
// Captura cualquier error inesperado y lo muestra en pantalla (para poder
// diagnosticar problemas sin acceso a la consola del navegador).
window.addEventListener("error", function(e){
  const m=document.getElementById("modalMsg");
  if(m){m.className="err";m.style.display="block";m.textContent="Error técnico: "+(e.message||"desconocido")+" (línea "+(e.lineno||"?")+")";}
});
window.addEventListener("unhandledrejection", function(e){
  const m=document.getElementById("modalMsg");
  if(m){m.className="err";m.style.display="block";m.textContent="Error técnico (promesa): "+(e.reason&&e.reason.message||e.reason||"desconocido");}
});

const SUPABASE_URL="https://stkfdzqwcnzievrmivaj.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0a2ZkenF3Y256aWV2cm1pdmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODM4MzIsImV4cCI6MjEwNDQ1OTgzMn0.rMlhM8TBZhtwroF3lOwRBB8LOyRplPgZQnsUWtjptsM";
const DESTINO_WHATSAPP="5491123627052";

const BUCKET="https://stkfdzqwcnzievrmivaj.supabase.co/storage/v1/object/public/productos-distribuidora/";

// Cada producto tiene sus 3 niveles: x1 (precio normal), x3 y x5 (con descuento).
// precio = total de esa cantidad de packs, ya con el descuento aplicado (tal cual la tabla que pasaste).
const PRODUCTOS=[
 {nombre:"Hamburguesa Clásica x4",categoria:"Hamburguesas",foto:"clasica-x4.jpg",
  tiers:[{qty:1,precio:4200},{qty:3,precio:11970},{qty:5,precio:18480}]},
 {nombre:"Hamburguesa Semillas x4",categoria:"Hamburguesas",foto:"semillas-x4.jpg",
  tiers:[{qty:1,precio:4500},{qty:3,precio:12825},{qty:5,precio:19800}]},
 {nombre:"Hamburguesa Queso x4",categoria:"Hamburguesas",foto:"queso-x4.jpg",
  tiers:[{qty:1,precio:4900},{qty:3,precio:13965},{qty:5,precio:21560}]},
 {nombre:"Hamburguesa Vegana x4",categoria:"Hamburguesas",foto:"vegano-x4.jpg",
  tiers:[{qty:1,precio:4600},{qty:3,precio:13110},{qty:5,precio:20240}]},
 {nombre:"Hamburguesa Smash x4",categoria:"Hamburguesas",foto:"smash-x4.jpg",
  tiers:[{qty:1,precio:3300},{qty:3,precio:9405},{qty:5,precio:14520}]},
 {nombre:"Pancho Corto Clásico x6",categoria:"Panchos",foto:"corto-clasico-x6.jpg",
  tiers:[{qty:1,precio:3400},{qty:3,precio:9690},{qty:5,precio:14960}]},
 {nombre:"Pancho Corto Semillas x6",categoria:"Panchos",foto:"corto-semillas-x6.jpg",
  tiers:[{qty:1,precio:3400},{qty:3,precio:9690},{qty:5,precio:14960}]},
 {nombre:"Pancho Corto Queso x6",categoria:"Panchos",foto:"corto-queso-x6.jpg",
  tiers:[{qty:1,precio:4400},{qty:3,precio:12540},{qty:5,precio:19360}]},
 {nombre:"Pebete x2",categoria:"Variedades",foto:"pebete-x2.jpg",
  tiers:[{qty:1,precio:1820},{qty:3,precio:5187},{qty:5,precio:8008}]},
 {nombre:"Pan de Molde x1",categoria:"Variedades",foto:"molde-x1.jpg",
  tiers:[{qty:1,precio:3500},{qty:3,precio:9975},{qty:5,precio:15400}]},
 {nombre:"Árabe x4",categoria:"Variedades",foto:"arabe-x4.jpg",
  tiers:[{qty:1,precio:2500},{qty:3,precio:7125},{qty:5,precio:11000}]},
 {nombre:"Lomitero x2",categoria:"Variedades",foto:null,
  tiers:[{qty:1,precio:2600},{qty:3,precio:7410},{qty:5,precio:11440}]},
 {nombre:"Chips x6",categoria:"Variedades",foto:"chips-comunes-x6.jpg",
  tiers:[{qty:1,precio:2250},{qty:3,precio:6412.50},{qty:5,precio:9900}]},
 {nombre:"Chips Queso x6",categoria:"Variedades",foto:"chips-con-queso-x6.jpg",
  tiers:[{qty:1,precio:3100},{qty:3,precio:8835},{qty:5,precio:13640}]},
];

const money=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",minimumFractionDigits:0,maximumFractionDigits:2}).format(n);
const $=id=>document.getElementById(id);

// selected[i] = índice del tier elegido (0,1,2) o null si no se agregó
let selected=Array(PRODUCTOS.length).fill(null);
let activeFilter="Todos";

function categorias(){
  return ["Todos",...new Set(PRODUCTOS.map(p=>p.categoria))];
}

function renderFilters(){
  $("filters").innerHTML=categorias().map(c=>
    `<button class="${c===activeFilter?"active":""}" data-c="${c}">${c}</button>`
  ).join("");
  $("filters").querySelectorAll("button").forEach(b=>{
    b.addEventListener("click",()=>{activeFilter=b.dataset.c;renderFilters();renderCatalog();});
  });
}

function tierBadge(p,tierIdx){
  // el nivel de mayor cantidad se marca como mayor ahorro
  if(tierIdx===p.tiers.length-1 && p.tiers.length>1) return "Mayor ahorro";
  return null;
}

// Arma el HTML de las opciones de pack (1 pack / 3 packs / 5 packs, etc.)
// de un producto. Se usa dentro del modal de detalle.
function tiersHtml(p,i){
  const sel=selected[i];
  return p.tiers.map((t,ti)=>{
    const isSel=sel===ti;
    const base=p.tiers[0].precio*t.qty;
    const ahorro=t.qty>1?Math.round((1-t.precio/base)*100):null;
    const badge=tierBadge(p,ti);
    const unitLabel=t.qty===1?"1 pack":`${t.qty} packs`;
    return `
      <div class="tier ${isSel?"selected":""}" data-i="${i}" data-ti="${ti}">
        ${badge?`<span class="badge">${badge}</span>`:""}
        <div class="tier-left">
          <span class="radio"></span>
          <div>
            <div class="tier-qty">${unitLabel}</div>
            ${ahorro?`<span class="save-tag">Ahorrás ${ahorro}%</span>`:""}
          </div>
        </div>
        <div class="tier-right">
          ${t.qty>1?`<span class="tier-old">${money(base)}</span>`:""}
          <span class="tier-price">${money(t.precio)}</span>
        </div>
      </div>`;
  }).join("");
}

// Catálogo compacto: una tarjeta por producto con foto, nombre y precio
// "desde". El detalle completo (los packs) se abre al hacer clic.
function renderCatalog(){
  const lista=PRODUCTOS.filter(p=>activeFilter==="Todos"||p.categoria===activeFilter);
  $("catalog").innerHTML=lista.map((p)=>{
    const i=PRODUCTOS.indexOf(p);
    const enCarrito=selected[i]!=null;
    const imgTag=p.foto?`<img src="${BUCKET}${p.foto}" alt="">`:`<div class="ph-noimg">Sin foto</div>`;
    return `
      <div class="product-card ${enCarrito?"in-cart":""}" data-i="${i}">
        <div class="ph-photo">
          ${imgTag}
          ${enCarrito?`<span class="in-cart-tag">✓ En tu pedido</span>`:""}
        </div>
        <div class="pc-body">
          <div class="name">${p.nombre}</div>
          <div class="from-price">Desde <strong>${money(p.tiers[0].precio)}</strong></div>
          <div class="pc-btn">${enCarrito?"Ver / cambiar":"Ver opciones"}</div>
        </div>
      </div>`;
  }).join("");

  $("catalog").querySelectorAll(".product-card").forEach(el=>{
    el.addEventListener("click",()=>abrirProducto(parseInt(el.dataset.i)));
  });
}

let productoAbierto=null;

function abrirProducto(i){
  productoAbierto=i;
  const p=PRODUCTOS[i];
  $("pmPhoto").innerHTML=p.foto?`<img src="${BUCKET}${p.foto}" alt="">`:`<div class="ph-noimg">Sin foto</div>`;
  $("pmName").textContent=p.nombre;
  renderTiersModal();
  $("productModalBg").classList.add("open");
}

function renderTiersModal(){
  if(productoAbierto==null)return;
  $("pmTiers").innerHTML=tiersHtml(PRODUCTOS[productoAbierto],productoAbierto);
  $("pmTiers").querySelectorAll(".tier").forEach(el=>{
    el.addEventListener("click",()=>{
      const i=parseInt(el.dataset.i);
      const ti=parseInt(el.dataset.ti);
      selected[i]=selected[i]===ti?null:ti; // click de nuevo lo deselecciona
      renderTiersModal();
      renderCatalog();
      updateCartBar();
    });
  });
  const sel=selected[productoAbierto];
  const btn=$("pmAddBtn");
  if(sel!=null){
    btn.disabled=false;
    btn.textContent="Agregar al carrito · "+money(PRODUCTOS[productoAbierto].tiers[sel].precio);
  }else{
    btn.disabled=true;
    btn.textContent="Elegí un pack arriba";
  }
}

function cerrarProducto(){
  $("productModalBg").classList.remove("open");
  productoAbierto=null;
}
$("closeProductModal").addEventListener("click",cerrarProducto);
$("productModalBg").addEventListener("click",e=>{if(e.target.id==="productModalBg")cerrarProducto();});
$("pmAddBtn").addEventListener("click",()=>{
  if(productoAbierto==null||selected[productoAbierto]==null)return;
  cerrarProducto();
  updateCartBar();
  $("cartBar").scrollIntoView({behavior:"smooth",block:"end"});
});

function carrito(){
  return PRODUCTOS.map((p,i)=>({p,tier:selected[i]!=null?p.tiers[selected[i]]:null}))
    .filter(x=>x.tier);
}

function totalCarrito(){
  return carrito().reduce((s,x)=>s+x.tier.precio,0);
}

let envioOpcionesDisponibles=[];
let envioSeleccionado=null; // {carrier_id, service_type, logistic_type, carrier_name, price}

function totalConEnvio(){
  return totalCarrito()+(envioSeleccionado?envioSeleccionado.price:0);
}

async function cotizarEnvio(){
  const nombre=$("fNombre").value.trim();
  const telefono=$("fWhatsapp").value.trim();
  const calle=$("fCalle").value.trim();
  const altura=$("fAltura").value.trim();
  const pisoDepto=$("fPisoDepto").value.trim();
  const localidad=$("fLocalidad").value.trim();
  const provincia=$("fProvincia").value.trim();
  const cp=$("fCP").value.trim();
  const cont=$("envioOpciones");
  const btn=$("cotizarEnvioBtn");

  if(!calle||!altura||!localidad||!provincia||!cp){
    cont.innerHTML='<div class="cart-item" style="color:#b3261e">Completá calle, altura, localidad, provincia y código postal para calcular el envío.</div>';
    return;
  }

  btn.disabled=true;btn.textContent="Calculando...";
  cont.innerHTML='<div class="cart-item">Calculando opciones de envío...</div>';
  envioSeleccionado=null;

  try{
    const r=await fetch("/api/zipnova-cotizar",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({nombre,telefono,calle,altura,pisoDepto,localidad,provincia,codigoPostal:cp,valorDeclarado:totalCarrito()})
    });
    const data=await r.json();
    if(!data.ok){
      const detalleTxt=data.detalle?" — "+JSON.stringify(data.detalle).slice(0,300):"";
      throw new Error((data.error||"No se pudo cotizar el envío")+detalleTxt);
    }
    const opciones=Array.isArray(data.opciones)?data.opciones:[];
    envioOpcionesDisponibles=opciones;
  }catch(e){
    envioOpcionesDisponibles=[];
    cont.innerHTML='<div class="cart-item" style="color:#b3261e">No se pudo calcular el envío automático: '+(e.message||"error desconocido")+'</div>';
  }
  renderOpcionesEnvio();
  btn.disabled=false;btn.textContent="📦 Calcular costo de envío";
}

function renderOpcionesEnvio(){
  const cont=$("envioOpciones");
  const sinAutomaticas=!envioOpcionesDisponibles.length
    ?'<div class="cart-item" style="color:#888">No hay transportistas automáticos disponibles para esa dirección.</div>'
    :"";
  const listaAutomaticas=envioOpcionesDisponibles.map((op,idx)=>`
    <label class="cart-item" style="display:flex;align-items:center;gap:8px;cursor:pointer">
     <input type="radio" name="envioOpcion" value="${idx}" onchange="elegirEnvio(${idx})">
     <span style="flex:1">${op.carrier_name||op.carrier||"Transportista"} ${op.estimated_days?`· ~${op.estimated_days} días`:""}</span>
     <span>${money(op.price)}</span>
    </label>`).join("");
  const opcionCoordinar=`
    <label class="cart-item" style="display:flex;align-items:center;gap:8px;cursor:pointer">
     <input type="radio" name="envioOpcion" value="coordinar" onchange="elegirEnvioCoordinar()">
     <span style="flex:1">🏍️ Moto mensajería (a coordinar por WhatsApp)</span>
     <span style="color:#888">A coordinar</span>
    </label>`;
  cont.innerHTML=sinAutomaticas+listaAutomaticas+opcionCoordinar;
}

function elegirEnvio(idx){
  const op=envioOpcionesDisponibles[idx];
  if(!op)return;
  envioSeleccionado={
    carrier_id:op.carrier_id,
    service_type:op.service_type,
    logistic_type:op.logistic_type||null,
    carrier_name:op.carrier_name||op.carrier||"Transportista",
    price:op.price
  };
  renderModalCart();
}

function elegirEnvioCoordinar(){
  envioSeleccionado={
    carrier_id:null,
    service_type:null,
    logistic_type:null,
    carrier_name:"Moto mensajería (a coordinar)",
    price:0,
    aCoordinar:true
  };
  renderModalCart();
}

$("cotizarEnvioBtn").addEventListener("click",cotizarEnvio);

function updateCartBar(){
  const items=carrito();
  const bar=$("cartBar");
  if(items.length===0){bar.style.display="none";return;}
  bar.style.display="flex";
  $("cartCount").textContent=items.length+(items.length===1?" producto":" productos");
  $("cartTotal").textContent=money(totalCarrito());
}

function renderModalCart(){
  const items=carrito();
  let html=items.map(x=>
    `<div class="cart-item"><span>${x.p.nombre} · ${x.tier.qty} pack${x.tier.qty>1?"s":""}</span><span>${money(x.tier.precio)}</span></div>`
  ).join("")||`<div class="cart-item"><span>Sin productos todavía</span></div>`;
  if(envioSeleccionado){
    html+=`<div class="cart-item"><span>🚚 Envío · ${envioSeleccionado.carrier_name}</span><span>${envioSeleccionado.aCoordinar?"A coordinar":money(envioSeleccionado.price)}</span></div>`;
  }
  $("cartItems").innerHTML=html;
  $("modalTotal").textContent=money(totalConEnvio());
}

$("openCheckout").addEventListener("click",()=>{
  renderModalCart();
  $("modalBg").classList.add("open");
});
$("closeModal").addEventListener("click",()=>$("modalBg").classList.remove("open"));
$("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")$("modalBg").classList.remove("open");});

function actualizarTextoBoton(){
  const pago=$("fPago").value;
  $("sendOrder").textContent=pago==="Mercado Pago"?"Continuar y pagar":"Enviar pedido por WhatsApp";
}
$("fPago").addEventListener("change",actualizarTextoBoton);

async function enviarPedido(){
  const items=carrito();
  const nombre=$("fNombre").value.trim();
  const wa=$("fWhatsapp").value.trim();
  const email=$("fEmail").value.trim();
  const calle=$("fCalle").value.trim();
  const altura=$("fAltura").value.trim();
  const pisoDepto=$("fPisoDepto").value.trim();
  const localidad=$("fLocalidad").value.trim();
  const provincia=$("fProvincia").value.trim();
  const cp=$("fCP").value.trim();
  const direccion=[`${calle} ${altura}`.trim(),pisoDepto,localidad,provincia].filter(Boolean).join(", ");
  const pago=$("fPago").value;
  const obs=$("fObs").value.trim();
  const msg=$("modalMsg");
  const btn=$("sendOrder");
  const payLink=$("payLink");
  msg.className="";msg.style.display="none";
  payLink.style.display="none";
  btn.style.display="inline-block";

  if(items.length===0){msg.className="err";msg.textContent="Agregá al menos un producto.";return;}
  if(!nombre||!wa||!calle||!altura||!localidad||!provincia||!cp){msg.className="err";msg.textContent="Completá nombre, WhatsApp y la dirección completa.";return;}
  if(pago==="Mercado Pago"&&!email){msg.className="err";msg.textContent="Para pagar con Mercado Pago necesitamos tu email.";return;}

  const productos=items.map(x=>({
    producto:`${x.p.nombre} (Pack x${x.tier.qty})`,
    cantidad:1,
    precio_unitario:x.tier.precio
  }));
  if(envioSeleccionado){
    productos.push({
      producto:`Envío · ${envioSeleccionado.carrier_name}`,
      cantidad:1,
      precio_unitario:envioSeleccionado.price
    });
  }
  const total=totalConEnvio();

  // Generamos nosotros mismos un código único para este pedido. Así no
  // necesitamos que Supabase nos devuelva el registro recién creado
  // (el rol público no tiene permiso de lectura, solo de escritura).
  const referencia="MP-"+Date.now()+"-"+Math.random().toString(36).slice(2,8);

  btn.disabled=true;btn.textContent="Enviando...";

  try{
    const resp=await fetch(SUPABASE_URL+"/rest/v1/pedidos_distribuidora",{
      method:"POST",
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY,
        "Content-Type":"application/json",
        "Prefer":"return=minimal"
      },
      body:JSON.stringify({
        comercio:nombre,
        whatsapp:wa,
        domicilio:direccion,
        direccion_calle:calle,
        direccion_altura:altura,
        direccion_piso_depto:pisoDepto||null,
        localidad:localidad,
        provincia:provincia,
        codigo_postal:cp,
        productos:productos,
        total:total,
        observaciones:obs||null,
        estado:"Pendiente",
        estado_pago:pago,
        canal:"tienda",
        referencia_pago:pago==="Mercado Pago"?referencia:null,
        envio_elegido_transportista:envioSeleccionado?envioSeleccionado.carrier_name:null,
        envio_elegido_costo:envioSeleccionado?envioSeleccionado.price:null,
        zipnova_carrier_id:envioSeleccionado?String(envioSeleccionado.carrier_id):null,
        zipnova_service_type:envioSeleccionado?envioSeleccionado.service_type:null,
        zipnova_logistic_type:envioSeleccionado?envioSeleccionado.logistic_type:null
      })
    });
    if(!resp.ok){
      const t=await resp.text();
      throw new Error(t);
    }

    if(pago==="Mercado Pago"){
      btn.textContent="Generando link de pago...";
      const mpResp=await fetch("/api/crear-preferencia",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          items:productos.map(p=>({title:p.producto,quantity:1,unit_price:p.precio_unitario})),
          payer:{name:nombre,email:email},
          external_reference:referencia
        })
      });
      const mpData=await mpResp.json();
      if(!mpResp.ok||!mpData.init_point){
        throw new Error(mpData.error||"No se pudo generar el link de pago");
      }
      btn.style.display="none";
      payLink.href=mpData.init_point;
      payLink.style.display="block";
      msg.className="ok";
      msg.textContent="¡Pedido guardado! Tocá el botón de abajo para pagar.";
      selected=Array(PRODUCTOS.length).fill(null);
      envioSeleccionado=null;envioOpcionesDisponibles=[];$("envioOpciones").innerHTML="";
      renderCatalog();updateCartBar();
      return;
    }

    let texto=`🛒 *Pedido tienda minorista*\n\n`;
    texto+=`👤 ${nombre}\n📱 ${wa}\n📍 ${direccion}\n💳 ${pago}\n\n`;
    productos.forEach(p=>{texto+=`• ${p.producto} — ${money(p.precio_unitario)}\n`;});
    texto+=`\n*Total: ${money(total)}*`;
    if(obs)texto+=`\n\n📝 ${obs}`;

    window.open("https://wa.me/"+DESTINO_WHATSAPP+"?text="+encodeURIComponent(texto),"_blank");

    msg.className="ok";
    msg.textContent="¡Pedido enviado! Te abrimos WhatsApp para confirmar.";
    selected=Array(PRODUCTOS.length).fill(null);
    envioSeleccionado=null;envioOpcionesDisponibles=[];$("envioOpciones").innerHTML="";
    renderCatalog();updateCartBar();
    $("fNombre").value="";$("fWhatsapp").value="";$("fCalle").value="";$("fAltura").value="";$("fPisoDepto").value="";$("fLocalidad").value="";$("fProvincia").value="";$("fCP").value="";$("fObs").value="";
  }catch(e){
    msg.className="err";
    msg.textContent="No se pudo registrar el pedido. "+(e.message||"Error desconocido");
  }finally{
    btn.disabled=false;
    actualizarTextoBoton();
  }
}

$("sendOrder").addEventListener("click",enviarPedido);
actualizarTextoBoton();

renderFilters();
renderCatalog();
</script>
