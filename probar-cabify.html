<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Probar cotización Cabify</title>
<style>
body{font-family:Arial,sans-serif;max-width:520px;margin:40px auto;padding:0 16px;color:#333}
input{width:100%;padding:10px;margin:8px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{padding:10px 18px;background:#542477;color:#fff;border:0;border-radius:6px;cursor:pointer;font-weight:bold}
pre{background:#f4f4f4;padding:12px;border-radius:6px;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<h2>Probar /api/cabify-cotizar</h2>
<label>Dirección de destino</label>
<input id="dir" value="Av. Corrientes 1234, CABA, Argentina">
<button onclick="probar()">Cotizar</button>
<pre id="out">(resultado acá)</pre>
<script>
async function probar(){
  const out = document.getElementById("out");
  out.textContent = "Consultando...";
  try{
    const r = await fetch("/api/cabify-cotizar", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({direccion: document.getElementById("dir").value})
    });
    const data = await r.json();
    out.textContent = "HTTP " + r.status + "\n\n" + JSON.stringify(data, null, 2);
  }catch(e){
    out.textContent = "Error: " + e.message;
  }
}
</script>
</body>
</html>
