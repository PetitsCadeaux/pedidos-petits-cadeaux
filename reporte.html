<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#35265f">
<title>Reporte de Pedidos - Petits Cadeaux</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500;600;700;800&display=swap');
:root{--purple:#542477;--lilac:#a66ac7;--ink:#392541;--muted:#76657d;--line:#eaddea}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Poppins,Arial,sans-serif;background:radial-gradient(circle at 10% 0%,#fff 0,transparent 30%),linear-gradient(180deg,#f8edf4,#fffafe 42%,#f8f0fa);min-height:100vh}
header{padding:16px;text-align:center;background:linear-gradient(180deg,#fff7fb,#f8eaf4);color:var(--purple);border-bottom:1px solid #ead9e8;box-shadow:0 7px 24px rgba(84,36,119,.08)}
header h1{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:clamp(22px,6vw,32px);font-weight:700}
.navlink{display:inline-block;margin-top:8px;color:#865a8e;font-size:13px;font-weight:700;text-decoration:none}
main{max-width:820px;margin:auto;padding:18px 14px 42px}
.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:0 10px 30px rgba(84,36,119,.08)}
label{display:block;margin-top:11px;color:#5f4d68;font-size:14px;font-weight:800}
input,select{width:100%;padding:14px 15px;margin-top:7px;border:1px solid #ddcfe1;border-radius:16px;background:#fff;color:var(--ink);font:500 16px Poppins,Arial,sans-serif;outline:none}
input:focus,select:focus{border-color:var(--lilac);box-shadow:0 0 0 4px rgba(166,106,199,.13)}
button{border:0;border-radius:15px;font:800 15px Poppins,Arial,sans-serif;cursor:pointer}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn-main{padding:14px 18px;background:linear-gradient(135deg,#995ac2,#71369e);color:#fff;box-shadow:0 8px 20px rgba(113,54,158,.22)}
.btn-sec{padding:14px 18px;background:#fff;border:1px solid #ddcde4;color:#654273}
.btns-row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btns-row button{flex:1;min-width:140px}
.err{background:#fff0f1;color:#9b3040;border:1px solid #f2ccd2;padding:12px 14px;border-radius:14px;margin-top:12px;font-weight:600;font-size:14px}
table{width:100%;border-collapse:collapse;margin-top:6px}
th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;border-bottom:2px solid var(--purple);padding:6px 4px}
th.num,td.num{text-align:right}
td{padding:9px 4px;border-bottom:1px dotted #eee1ef;font-size:14.5px}
tfoot td{font-weight:800;color:var(--purple);border-top:2px solid var(--purple);border-bottom:0}
.empty{padding:30px;text-align:center;color:#817287;background:#fbf7fc;border:1px dashed #dfd0e4;border-radius:16px;margin-top:14px}
.loading{text-align:center;padding:30px;color:var(--muted)}
.sub-list{margin-top:10px;font-size:13px;color:var(--muted)}
.sub-list div{padding:3px 0;border-bottom:1px dotted #f0e5f0;display:flex;justify-content:space-between}
@media print{
 header,.no-print{display:none}
 body{background:#fff}
 .card{box-shadow:none;border:1px solid #ccc}
}
</style>
</head>
<body>

<header class="no-print">
 <h1>📦 Reporte de Pedidos</h1>
 <a class="navlink" href="admin.html">← Volver al panel de pedidos</a>
</header>

<div class="no-print" style="text-align:center;margin:10px 0"><strong style="font-family:'Cormorant Garamond',serif;font-size:22px;color:#542477">Resumen para el distribuidor</strong></div>

<main>

<div id="noSession" class="card" style="display:none;text-align:center">
 <p>Tenés que iniciar sesión primero en el panel de pedidos.</p>
 <a href="admin.html"><button class="btn-main">Ir a iniciar sesión</button></a>
</div>

<div id="content" style="display:none">

 <div class="card no-print">
  <label>Día de entrega
   <select id="fDia">
    <option value="Todos">Todos</option>
    <option value="Miércoles">Miércoles</option>
    <option value="Viernes">Viernes</option>
   </select>
  </label>
  <div class="row2">
   <label>Desde<input type="date" id="fDesde"></label>
   <label>Hasta<input type="date" id="fHasta"></label>
  </div>
  <div class="btns-row">
   <button class="btn-main" id="aplicarBtn">Aplicar filtro</button>
   <button class="btn-sec" id="exportBtn">⬇️ Exportar CSV</button>
   <button class="btn-sec" id="printBtn">🖨️ Imprimir</button>
  </div>
 </div>

 <div class="card">
  <h2 id="tituloReporte" style="margin:0 0 4px;font-family:'Cormorant Garamond',serif;color:var(--purple);font-size:24px">Cantidad total por producto</h2>
  <div id="resumen" class="sub-list"></div>
  <div id="tablaWrap"><div class="loading">Cargando...</div></div>
 </div>

</div>

</main>

<script>
const SUPABASE_URL="https://stkfdzqwcnzievrmivaj.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0a2ZkenF3Y256aWV2cm1pdmFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODM4MzIsImV4cCI6MjEwNDQ1OTgzMn0.rMlhM8TBZhtwroF3lOwRBB8LOyRplPgZQnsUWtjptsM";
const $=id=>document.getElementById(id);
const money=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n||0);

const session=JSON.parse(localStorage.getItem("admin_session")||"null");
let orders=[];
let currentAgg=[];

async function apiFetch(path,options={}){
 const r=await fetch(SUPABASE_URL+path,{
  ...options,
  headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+session.access_token,"Content-Type":"application/json",...(options.headers||{})}
 });
 if(r.status===401){localStorage.removeItem("admin_session");location.href="admin.html";throw new Error("Sesión vencida")}
 return r;
}

async function cargar(){
 $("tablaWrap").innerHTML='<div class="loading">Cargando...</div>';
 try{
  const r=await apiFetch("/rest/v1/pedidos_distribuidora?select=*&order=created_at.desc");
  orders=await r.json();
  aplicarFiltro();
 }catch(e){
  $("tablaWrap").innerHTML='<div class="err">❌ '+(e.message||"Error al cargar pedidos")+'</div>';
 }
}

function aplicarFiltro(){
 const dia=$("fDia").value;
 const desde=$("fDesde").value;
 const hasta=$("fHasta").value;

 const filtrados=orders.filter(o=>{
  if(dia!=="Todos"&&o.dia_entrega!==dia)return false;
  const fecha=(o.created_at||"").slice(0,10);
  if(desde&&fecha<desde)return false;
  if(hasta&&fecha>hasta)return false;
  return true;
 });

 const map={};
 filtrados.forEach(o=>(o.productos||[]).forEach(it=>{
  if(!map[it.producto])map[it.producto]={producto:it.producto,cantidad:0,importe:0,confirmar:false};
  map[it.producto].cantidad+=it.cantidad;
  if(it.precio_unitario!=null)map[it.producto].importe+=it.cantidad*it.precio_unitario;
  else map[it.producto].confirmar=true;
 }));
 currentAgg=Object.values(map).sort((a,b)=>b.cantidad-a.cantidad);

 const totalPedidos=filtrados.length;
 const totalUnidades=currentAgg.reduce((s,p)=>s+p.cantidad,0);
 const totalImporte=filtrados.reduce((s,o)=>s+(o.total||0),0);
 $("resumen").innerHTML=`
  <div><span>Pedidos incluidos</span><span>${totalPedidos}</span></div>
  <div><span>Unidades totales</span><span>${totalUnidades}</span></div>
  <div><span>Importe total</span><span>${money(totalImporte)}</span></div>
 `;

 if(!currentAgg.length){$("tablaWrap").innerHTML='<div class="empty">No hay pedidos que coincidan con el filtro.</div>';return}

 $("tablaWrap").innerHTML=`<table>
  <thead><tr><th>Producto</th><th class="num">Cantidad</th><th class="num">Importe</th></tr></thead>
  <tbody>${currentAgg.map(p=>`<tr><td>${p.producto}</td><td class="num">${p.cantidad}</td><td class="num">${p.confirmar?"A confirmar":money(p.importe)}</td></tr>`).join("")}</tbody>
  <tfoot><tr><td>Total</td><td class="num">${totalUnidades}</td><td class="num">${money(totalImporte)}</td></tr></tfoot>
 </table>`;
}

function exportarCSV(){
 if(!currentAgg.length){alert("No hay datos para exportar.");return}
 let csv="Producto,Cantidad,Importe\n";
 currentAgg.forEach(p=>{
  csv+=`"${p.producto}",${p.cantidad},${p.confirmar?"A confirmar":p.importe}\n`;
 });
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="reporte_pedidos_"+new Date().toISOString().slice(0,10)+".csv";
 a.click();
 URL.revokeObjectURL(url);
}

$("aplicarBtn").addEventListener("click",aplicarFiltro);
$("exportBtn").addEventListener("click",exportarCSV);
$("printBtn").addEventListener("click",()=>window.print());

if(session){
 $("content").style.display="block";
 cargar();
}else{
 $("noSession").style.display="block";
}
</script>
</body>
</html>
