<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#35265f">
<title>Pedidos - Petits Cadeaux</title>
<style>
:root{--violeta:#35265f;--violeta2:#6e4aa8;--lila:#b978dc;--texto:#30253b;--borde:#eadbea}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(180deg,#f8edf2 0,#fffafe 38%,#f7f0fa 100%);color:var(--texto)}
header{background:linear-gradient(135deg,var(--violeta),#49347d);color:white;padding:22px 16px 28px;text-align:center;box-shadow:0 6px 24px #35265f25}
.logo{width:118px;height:118px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 12px;box-shadow:0 8px 24px #1d123c55;border:4px solid #ffffffaa}
header h1{font-family:Georgia,serif;font-size:28px;margin:4px 0 6px}
header p{margin:0;color:#f6dff7;font-size:14px}
main{max-width:760px;margin:auto;padding:16px 14px 36px}
.card{background:#ffffffee;border:1px solid var(--borde);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px #4c2d6910}
h2{font-family:Georgia,serif;margin:0 0 14px;color:var(--violeta);font-size:21px}
.info{background:linear-gradient(135deg,#fff4f8,#f5edfb);border:1px solid #ead5ea;border-radius:16px;padding:13px 14px;margin-bottom:18px;font-size:14px;line-height:1.45}
label{display:block;font-weight:700;font-size:14px;color:#594a66;margin-top:10px}
input,select,textarea{width:100%;padding:13px 14px;margin-top:7px;border:1px solid #dccfe0;border-radius:13px;font-size:16px;background:#fff;color:#30253b;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--lila);box-shadow:0 0 0 3px #b978dc22}
textarea{min-height:95px;resize:vertical}
.products{display:grid;gap:9px}
.product{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid #eee1ef;border-radius:16px;padding:12px 12px 12px 14px}
.product-name{font-weight:750;font-size:15px}
.product-unit{font-size:13px;color:#7c6d82;margin-top:3px}
.product-right{display:flex;align-items:center;gap:8px}
.qty{display:flex;align-items:center;border:1px solid #ddd0e2;border-radius:13px;overflow:hidden;background:#faf7fc}
.qty button{width:36px;height:38px;padding:0;border:0;background:transparent;color:var(--violeta);font-size:22px;font-weight:700}
.qty input{width:44px;height:38px;margin:0;padding:0;border:0;border-radius:0;text-align:center;background:transparent;font-weight:700}
.line-total{min-width:86px;text-align:right;font-weight:800;font-size:14px;color:#4e3964}
.total-box{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding:16px;border-radius:17px;background:linear-gradient(135deg,var(--violeta),var(--violeta2));color:white}
.total-box span{font-size:14px;opacity:.9}
.total-box strong{font-size:25px}
button.send{width:100%;margin-top:12px;padding:15px;border:0;border-radius:15px;background:linear-gradient(135deg,#8c52d4,#6d39ad);color:#fff;font-weight:800;font-size:17px;box-shadow:0 7px 18px #6e4aa833}
button.send:disabled{opacity:.65}
.ok,.err{padding:13px 14px;border-radius:14px;margin-top:12px;font-weight:650}
.ok{background:#ecfaf4;color:#176044;border:1px solid #ccefe0}
.err{background:#fff0f1;color:#9b3040;border:1px solid #f2ccd2}
.note{font-size:12px;color:#7b6d80;margin-top:8px}
@media(max-width:560px){.product{grid-template-columns:1fr}.product-right{justify-content:space-between}.line-total{min-width:auto}.logo{width:104px;height:104px}}
</style>
</head>

<script>
const SUPABASE_URL="https://xwqrswfeimmzdufvfpha.supabase.co";
const SUPABASE_KEY="sb_publishable_1rnww5jSQ8rGSYNhhRFWww_rfbC4AET";
const DESTINO_WHATSAPP="5491123627052";
const PRODUCTS=[["Clásica x4",2760],["Semillas x4",2890],["Queso x4",3400],["Vegana x4",3200],["Smash x4",2240],["Smash x8",4180],["Clásicos x6",2250],["Semillas x6",2250],["Con Queso x6",2950],["Clásicos XL x6",3920],["Semillas XL x6",3920],["Con Queso XL x6",5250],["Chips Comunes x6",1540],["Chips con Queso x6",2070],["Pebete x2",1220],["Pan de Molde x1",2550],["Pan Árabe x4",1690]];
const money=n=>new Intl.NumberFormat("es-AR",{style:"currency",currency:"ARS",maximumFractionDigits:0}).format(n);
const $=id=>document.getElementById(id);
function render(){$("products").innerHTML=PRODUCTS.map((p,i)=>`<div class="product"><div><div class="product-name">${p[0]}</div><div class="product-unit">${money(p[1])} por unidad</div></div><div class="product-right"><div class="qty"><button type="button" onclick="changeQty(${i},-1)">−</button><input data-i="${i}" type="number" min="0" max="999" value="0" inputmode="numeric"><button type="button" onclick="changeQty(${i},1)">+</button></div><div class="line-total" id="line${i}">$0</div></div></div>`).join("");document.querySelectorAll("[data-i]").forEach(x=>x.addEventListener("input",totalizar));}
function qty(i){const el=document.querySelector(`[data-i="${i}"]`);return Math.max(0,Math.min(999,parseInt(el.value)||0));}
function changeQty(i,d){const el=document.querySelector(`[data-i="${i}"]`);el.value=Math.max(0,Math.min(999,(parseInt(el.value)||0)+d));totalizar();}
function totalizar(){let t=0;PRODUCTS.forEach((p,i)=>{const q=qty(i);t+=q*p[1];$("line"+i).textContent=money(q*p[1]);});$("total").textContent=money(t);return t;}
function items(){return PRODUCTS.map((p,i)=>({producto:p[0],cantidad:qty(i),precio_unitario:p[1]})).filter(x=>x.cantidad>0);}
function show(msg,ok){$("status").className=ok?"ok":"err";$("status").textContent=msg;}
function limpiarFormulario(){$("shop").value="";$("phone").value="";$("delivery").value="";$("notes").value="";document.querySelectorAll("[data-i]").forEach(x=>x.value=0);totalizar();}
async function enviar(){const comercio=$("shop").value.trim(),dia=$("delivery").value,wa=$("phone").value.trim(),obs=$("notes").value.trim();if(!comercio)return show("Ingresá el nombre del comercio.",false);if(!dia)return show("Seleccioná miércoles o viernes.",false);const total=totalizar(),lista=items();if(!total)return show("Seleccioná al menos un producto.",false);$("send").disabled=true;$("send").textContent="Guardando pedido...";try{const r=await fetch(SUPABASE_URL+"/rest/v1/pedidos",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"return=minimal"},body:JSON.stringify({comercio,whatsapp:wa,dia_entrega:dia,productos:lista,total,observaciones:obs||null,estado:"Pendiente"})});const text=await r.text();if(!r.ok)throw new Error(text);show("✅ Pedido registrado correctamente.",true);const lines=lista.map(x=>`• ${x.cantidad} × ${x.producto} — ${money(x.cantidad*x.precio_unitario)}`).join("\n");const msg=`Hola! 👋\nNuevo pedido\nComercio: ${comercio}\nWhatsApp: ${wa||"No informado"}\nDía de entrega: ${dia}\n\n${lines}\n\nTOTAL: ${money(total)}${obs?"\n\nObservaciones: "+obs:""}\n\nDistribuidora Petits Cadeaux`;window.open("https://wa.me/"+DESTINO_WHATSAPP+"?text="+encodeURIComponent(msg),"_blank");setTimeout(limpiarFormulario,1200);}catch(e){console.error(e);show("❌ No se pudo registrar el pedido. Supabase respondió: "+(e.message||"error desconocido"),false);}$("send").disabled=false;$("send").textContent="Enviar pedido por WhatsApp";}
$("send").addEventListener("click",enviar);render();totalizar();
</script>
</body>
</html>
